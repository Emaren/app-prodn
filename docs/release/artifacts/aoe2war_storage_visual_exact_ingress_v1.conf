# REVIEWED SOURCE PROPOSAL — NOT INSTALLED; not a root permit.
# Insert as an EXACT location in the existing aoe2war.com HTTPS server,
# before generic /api/ handling. Never create another Next.js runtime.
# Existing protected root nginx preimage + inverse are mandatory.
location = /api/internal/aoe2war-os/bridge {
    if ($request_method != POST) { return 405; }
    # A caller may not supply the server's trusted ingress scope.
    if ($http_x_aoe2war_bridge_scope != "") { return 403; }
    client_max_body_size 48k;
    proxy_request_buffering on;
    proxy_pass http://127.0.0.1:3032;
    proxy_http_version 1.1;
    proxy_set_header Host aoe2war.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Aoe2war-Bridge-Scope storage_visual;
    proxy_set_header X-Aoe2war-OS-Key $http_x_aoe2war_os_key;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 8s;
    proxy_read_timeout 8s;
}
