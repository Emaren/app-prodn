name: R18 F final owner install contract source seal
on:
  push:
    branches: [r18-f-final-owner-contract-seal]
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Prove exact owner contract source and protected installer against new W1_SAFE
        run: |
          python3 -m unittest discover -s tests -p 'test_r18_f_exact_integrated_identity.py' -v
          python3 -m unittest discover -s tests -p 'test_aoe2_solo_root_install_v2.py' -v
          grep -Fq '0cee3c836c4b0760478280c145e02e81e470ce0e' deploy/solo-native-audit/HEL1_ROOT_INSTALL_V2_CONTRACT.md
          if grep -Fq 'a9525f46302edff88ed073743a7dfaed08be9e3e' deploy/solo-native-audit/HEL1_ROOT_INSTALL_V2_CONTRACT.md; then echo 'HOLD: obsolete owner install source'; exit 2; fi
      - name: Retire temporary workflow then seal exact DocsV2
        run: |
          git config user.name 'aoe2war-docsv2-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r18-f-final-owner-contract-seal.yml
          git commit -m 'ci(R18 F): retire install-identity source proof workflow'
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          git add docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json
          git diff --cached --quiet && exit 1
          git commit -m 'docs(R18 F): exact current W1_SAFE owner install approval contract'
          python3 scripts/docs_v2_check.py
          git push origin HEAD:refs/heads/r18-f-final-owner-contract-seal
