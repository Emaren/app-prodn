name: One-shot held Satchel migration source-review DocsV2 seal (NO DEPLOY)

on:
  push:
    branches:
      - review/20261024-satchel-sql-exact-source-lock

permissions:
  contents: write

concurrency:
  group: one-shot-held-satchel-sql-review-20261024
  cancel-in-progress: false

jobs:
  retire-and-seal:
    if: github.repository == 'Emaren/app-prodn' && github.ref == 'refs/heads/review/20261024-satchel-sql-exact-source-lock'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retire temporary workflow before source certification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/satchel-migration-review-docsv2-one-shot.yml
          git commit -m "ci(held): retire one-shot finance SQL review seal helper"
      - name: Verify original eight SQL bytes and fail-closed tests
        run: |
          python3 scripts/satchel_eight_sql_source_inspect.py
          python3 -m unittest discover -s tests -p 'test_satchel_eight_sql_source_inspect.py'
      - name: Seal source docs using canonical DocsV2 generator
        run: |
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 - <<'PY'
          import subprocess
          allowed={'catalog-info.yaml','docs/DOCUMENTATION_CONTROL_PLANE.md','docs/document-registry.json'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          if (changed|untracked)-allowed:
              raise SystemExit('STOP unexpected DocsV2 output '+str(sorted((changed|untracked)-allowed)))
          print('DocsV2 changed',sorted(changed))
          PY
          python3 scripts/docs_v2_check.py
          git add -- catalog-info.yaml docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json
          git diff --cached --quiet || git commit -m "docs(held): certify Satchel migration review tripwire"
          git push origin HEAD:refs/heads/review/20261024-satchel-sql-exact-source-lock
