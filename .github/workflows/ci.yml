name: AoE2WAR CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aoe2war-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: Release and documentation control plane
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: yarn
      - name: Enable pinned package manager
        run: |
          corepack enable
          yarn --version
      - name: Install frozen dependencies for Python contracts
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Verify installed dependency security
        run: python3 scripts/check_dependency_security.py
      - name: Compile Python tooling
        run: python3 -m compileall -q scripts tests
      - name: Run Python contracts
        run: python3 scripts/run_python_contract.py
      - name: Census Code Health
        run: python3 scripts/aoe2_code_health.py --no-receipt --require-clean-worktree
      - name: Census internal module graph (read-only)
        run: python3 scripts/aoe2_module_graph.py --ci
      - name: Census HD API route authority evidence (read-only)
        run: python3 scripts/aoe2_route_authority.py --ci
      - name: Verify documentation control plane
        run: python3 scripts/docs_v2_check.py
      - name: Verify Node test inventory
        run: python3 scripts/run_test_contract.py --list
      - name: Scan candidate source for secrets
        run: python3 scripts/scan_tracked_secrets.py
      - name: Scan all added text across reviewed commit history
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/scan_changed_commit_history_secrets.py

  web:
    name: Type, contract, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aoe2war_ci
      SESSION_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_URL: http://127.0.0.1:3030
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: yarn
      - name: Enable pinned package manager
        run: |
          corepack enable
          yarn --version
      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Verify the reviewed secure minimatch import compatibility
        run: |
          node --test tests/r25-secure-minimatch-adapter.test.cjs
          node scripts/r25_secure_minimatch_eslint_adapter.cjs
      - name: Lint changed sources (Finish release-gate parity)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          base = os.environ.get("PR_BASE_SHA") or os.environ.get("PUSH_BEFORE_SHA")
          if not base or base == "0" * 40:
              raise SystemExit("Cannot prove changed-file ESLint without a Git base SHA")

          changes = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACMR", base, "HEAD", "--"],
              text=True,
          ).splitlines()
          extensions = {".ts", ".tsx", ".js", ".jsx", ".mts", ".mjs"}
          lintable = sorted(set(
              path for path in changes
              if Path(path).suffix.lower() in extensions and Path(path).is_file()
          ))
          if lintable:
              print(f"Checking {len(lintable)} changed JS/TS files with ESLint", flush=True)
              subprocess.run(["npx", "eslint", *lintable], check=True)
          else:
              print("No changed JS/TS files to lint", flush=True)
          PY
      - name: Run active Node contract inventory
        run: python3 scripts/run_test_contract.py
      - name: Build production application
        run: yarn build
      - name: Prove compiled financial gate source and build generation
        run: node scripts/check-hd-financial-build-identity.cjs
      - name: Census Next build performance
        run: python3 scripts/aoe2_speed_build.py --no-receipt --require-build

  isolated-rating-postgres:
    name: Isolated Steam-rating PostgreSQL chronology
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Never connect to production. The test creates a private Unix-socket
      # cluster under /tmp, exercises authority selection, then destroys it.
      RUN_PLAYER_CURRENT_RATING_PG_TESTS: "1"
      RUN_SATCHEL_PHYSICAL_PG_TESTS: "1"
      RUN_HD_FINANCIAL_FENCE_PG_TESTS: "1"
      RUN_LIVE_MARKET_PG_TESTS: "1"
      AOE2WAR_TEST_PG_BIN: /usr/lib/postgresql/16/bin
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/not_used
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: yarn
      - name: Enable pinned package manager
        run: corepack enable
      - name: Install pinned PostgreSQL test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16
          test -x /usr/lib/postgresql/16/bin/initdb
          test -x /usr/lib/postgresql/16/bin/pg_ctl
      - name: Prove C02 exact-source PG16 migration in isolated synthetic cluster (HOLD only)
        run: |
          python3 -B -m unittest discover -s tests -p 'test_c02_pg16_disposable_migration_hold.py' -q
          python3 -B - <<'PY'
          import json
          import subprocess

          check = subprocess.run(
              ["python3", "-B", "scripts/c02_pg16_disposable_migration_hold.py",
               "--pg-bin", "/usr/lib/postgresql/16/bin"],
              capture_output=True, text=True, timeout=75, check=False,
          )
          if check.returncode != 3:
              raise SystemExit("HOLD: C02 exact-source synthetic PostgreSQL migration did not produce the required nonauthorizing exit")
          try:
              evidence = json.loads(check.stdout)
          except ValueError as exc:
              raise SystemExit("HOLD: C02 synthetic migration evidence was not JSON") from exc
          required = {
              "status": "HOLD_SYNTHETIC_ONLY",
              "migration_count": 13,
              "pg_major": 16,
              "observed": ["tables=29", "rows=0", "triggers=53"],
              "negative_accounting_constraint_rejected": True,
              "valid_50k_product_plan_accepted": True,
              "invalid_60k_product_plan_rejected": True,
              "C02_physically_admitted": False,
              "C06_backup_verified": False,
              "C07_real_restore_verified": False,
              "live_database_accessed": False,
              "public_tcp_listener_created": False,
              "funded_release_authorized": False,
          }
          if any(evidence.get(key) != value for key, value in required.items()):
              raise SystemExit("HOLD: C02 migration physical census or release denial drifted")
          print("PASS: 13 exact-source synthetic PG16 migrations; 29 tables; 53 triggers; negative accounting rejected")
          print("HOLD: real C07 restore and any financial migration/release remain UNAUTHORIZED")
          PY
      - name: Install frozen application dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Prove current Steam RM/DM rating chronology against isolated PostgreSQL
        run: |
          node --experimental-strip-types \
            --experimental-loader ./scripts/aoe2-alias-loader.mjs \
            --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
            --test tests/current-watcher-rating-postgres.test.mts tests/war-satchel-physical-postgres.test.mts tests/war-satchel-return-runtime-postgres.test.mts tests/war-satchel-wager-authority-postgres.test.mts tests/war-satchel-owner-roundtrip-postgres.test.mts tests/hd-financial-maintenance-fence.test.mts tests/satchel-product-money-limits-postgres.test.mts tests/live-watcher-market-admission-postgres.test.mts

      - name: Pin Go for actual Satchel verifier integration
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24.6'
          cache: false
      - name: Authenticate real SDK deposit credit and signed wager proof
        run: python3 scripts/check-satchel-authenticated-credit.py
