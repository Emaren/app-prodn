name: AoE2WAR CI

on:
  workflow_dispatch:
    inputs:
      lint_base_sha:
        description: "Immutable common-ancestor SHA for audited manual release CI"
        required: true
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aoe2war-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: Release and documentation control plane
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: yarn
      - name: Enable pinned package manager
        run: |
          corepack enable
          yarn --version
      - name: Install frozen dependencies for Python contracts
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Verify installed dependency security
        run: python3 scripts/check_dependency_security.py
      - name: Compile Python tooling
        run: python3 -m compileall -q scripts tests
      - name: Run Python contracts
        run: python3 scripts/run_python_contract.py
      - name: Census Code Health
        run: python3 scripts/aoe2_code_health.py --no-receipt --require-clean-worktree
      - name: Census internal module graph (read-only)
        run: python3 scripts/aoe2_module_graph.py --ci
      - name: Census HD API route authority evidence (read-only)
        run: python3 scripts/aoe2_route_authority.py --ci
      - name: Verify documentation control plane
        run: python3 scripts/docs_v2_check.py
      - name: Verify Node test inventory
        run: python3 scripts/run_test_contract.py --list
      - name: Scan candidate source for secrets
        run: python3 scripts/scan_tracked_secrets.py

  web:
    name: Type, contract, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aoe2war_ci
      SESSION_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_URL: http://127.0.0.1:3030
      AOE2_BACKEND_UPSTREAM: http://127.0.0.1:3331
      AOE2WAR_ARTIFACT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: yarn
      - name: Enable pinned package manager
        run: |
          corepack enable
          yarn --version
      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Restore audited patched minimatch 11 legacy ESLint API
        run: node scripts/r25_secure_minimatch_eslint_adapter.cjs
      - name: Lint changed sources (Finish release-gate parity)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DISPATCH_BASE_SHA: ${{ inputs.lint_base_sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess

          base = os.environ.get("PR_BASE_SHA") or os.environ.get("PUSH_BEFORE_SHA")
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              dispatch = os.environ.get("DISPATCH_BASE_SHA", "")
              if not re.fullmatch(r"[0-9a-f]{40}", dispatch):
                  raise SystemExit("Manual CI requires an exact Git base SHA")
              pinned = subprocess.check_output(
                  ["git", "merge-base", "HEAD",
                   "origin/codex/central-thirdlane-a05-c-integrated-20261103"],
                  text=True,
              ).strip()
              if dispatch != pinned:
                  raise SystemExit("Manual CI base does not match exact integration merge-base")
              base = dispatch
          if not base or base == "0" * 40:
              raise SystemExit("Cannot prove changed-file ESLint without a Git base SHA")

          changes = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACMR", base, "HEAD", "--"],
              text=True,
          ).splitlines()
          extensions = {".ts", ".tsx", ".js", ".jsx", ".mts", ".mjs"}
          lintable = sorted(set(
              path for path in changes
              if Path(path).suffix.lower() in extensions and Path(path).is_file()
          ))
          if lintable:
              print(f"Checking {len(lintable)} changed JS/TS files with ESLint", flush=True)
              subprocess.run(["npx", "eslint", *lintable], check=True)
          else:
              print("No changed JS/TS files to lint", flush=True)
          PY
      - name: Run active Node contract inventory
        run: python3 scripts/run_test_contract.py
      - name: Build production application
        run: yarn build
      - name: Census Next build performance
        run: python3 scripts/aoe2_speed_build.py --no-receipt --require-build
      - name: Export the exact tested runtime artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: python3 -B scripts/aoe2_r25_c_parallel_stage.py --ci-export-artifact --artifact-output "$RUNNER_TEMP/aoe2war-runtime"
      - name: Preserve immutable production runtime bytes
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: aoe2war-runtime-${{ env.AOE2WAR_ARTIFACT_SOURCE_SHA }}
          path: ${{ runner.temp }}/aoe2war-runtime/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  isolated-rating-postgres:
    name: Isolated Steam-rating PostgreSQL chronology
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      # Never connect to production. The test creates a private Unix-socket
      # cluster under /tmp, exercises authority selection, then destroys it.
      RUN_PLAYER_CURRENT_RATING_PG_TESTS: "1"
      RUN_PRODUCTION_AUTH_PG_TESTS: "1"
      AOE2WAR_TEST_PG_BIN: /usr/lib/postgresql/16/bin
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/not_used
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: yarn
      - name: Enable pinned package manager
        run: corepack enable
      - name: Install pinned PostgreSQL test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16
          test -x /usr/lib/postgresql/16/bin/initdb
          test -x /usr/lib/postgresql/16/bin/pg_ctl
      - name: Install frozen application dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Prove current Steam RM/DM rating chronology against isolated PostgreSQL
        run: |
          node --experimental-strip-types \
            --experimental-loader ./scripts/aoe2-alias-loader.mjs \
            --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
            --test tests/current-watcher-rating-postgres.test.mts
      - name: Prove production auth grants and financial write denial in isolated PostgreSQL
        run: python3 -B -m unittest discover -s tests -p 'test_nonfinancial_production_auth_pg.py'
