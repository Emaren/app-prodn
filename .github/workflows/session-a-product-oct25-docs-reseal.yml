name: One-shot source-qualified October 25 product DocsV2 seal
on:
  push:
    branches:
      - session-a/20261025-nine-path-docs-recert-product
permissions:
  contents: write
concurrency:
  group: session-a-product-oct25-docs-reseal
  cancel-in-progress: false
jobs:
  self-retire-and-reseal:
    if: github.repository == 'Emaren/app-prodn' && github.ref == 'refs/heads/session-a/20261025-nine-path-docs-recert-product'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retire own workflow before final product-source baseline
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$GITHUB_REF" = "refs/heads/session-a/20261025-nine-path-docs-recert-product"
          git rm -- .github/workflows/session-a-product-oct25-docs-reseal.yml
          git commit -m 'ci: retire temporary product DocsV2 recertification workflow'
      - name: Regenerate governed source-bound DocsV2 receipts
        run: |
          set -euo pipefail
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 - <<'PY'
          import subprocess
          allowed={'docs/document-registry.json','docs/DOCUMENTATION_CONTROL_PLANE.md','catalog-info.yaml'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          if not changed or (changed|untracked)-allowed:
              raise SystemExit('RESEAL_UNEXPECTED_SCOPE='+str(sorted(changed|untracked)))
          print('EXACT_PRODUCT_DOCS_SEAL_PATHS=',sorted(changed))
          PY
          python3 scripts/docs_v2_check.py
      - name: Commit only governed docs in isolated product branch
        run: |
          set -euo pipefail
          git add -- docs/document-registry.json docs/DOCUMENTATION_CONTROL_PLANE.md catalog-info.yaml
          git diff --cached --quiet && exit 2
          git commit -m 'docs(control): seal October 25 website source-only review and product baseline'
          git push origin HEAD:refs/heads/session-a/20261025-nine-path-docs-recert-product
