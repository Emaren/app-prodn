name: Session B V22 three-source crash/inverse review (inert)

on:
  pull_request:
    paths:
      - "scripts/release/r25_v22_three_source_transaction_REVIEW_ONLY.py"
      - "tests/test_r25_v22_three_source_transaction_review.py"
      - ".github/workflows/r25-v22-three-source-transaction-review-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-source-transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exact three-source fixture and fail-closed invocation
        run: |
          python3 -B -m unittest -v tests.test_r25_v22_three_source_transaction_review
      - name: No production-execution CLI exists
        run: |
          python3 -B scripts/release/r25_v22_three_source_transaction_REVIEW_ONLY.py > /tmp/review-refusal.txt && exit 4 || rc=$?
          test "$rc" -eq 3
          grep -F 'HOLD:REVIEW_ONLY_NO_PRODUCTION_INSTALL_ENTRYPOINT' /tmp/review-refusal.txt
