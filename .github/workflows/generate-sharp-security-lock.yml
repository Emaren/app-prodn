name: Generate sharp security lock

on:
  push:
    branches:
      - fix/national-champions-art-challenge-20261006

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
      - name: Enable pinned package manager
        run: |
          corepack enable
          yarn --version
      - name: Generate patched lockfile
        run: yarn install --ignore-scripts --non-interactive
      - name: Rebind existing dev-only waiver to exact dependency graph
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          digest = hashlib.sha256()
          for name in ("package.json", "yarn.lock"):
              digest.update(name.encode())
              digest.update(b"\0")
              digest.update(Path(name).read_bytes())
              digest.update(b"\0")
          path = Path("config/dependency-security-waivers.json")
          payload = json.loads(path.read_text())
          for waiver in payload["waivers"]:
              if int(waiver["advisory_id"]) == 1240992:
                  waiver["dependency_digest"] = digest.hexdigest()
          path.write_text(json.dumps(payload, indent=2) + "\n")
          print("dependency_digest=" + digest.hexdigest())
          PY
      - name: Verify dependency security
        run: python3 scripts/check_dependency_security.py
      - name: Commit generated security state
        run: |
          if git diff --quiet -- yarn.lock config/dependency-security-waivers.json; then
            echo "Generated security state already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock config/dependency-security-waivers.json
          git commit -m "Regenerate patched dependency security state"
          git push origin HEAD:${GITHUB_REF_NAME}
