name: Renaissance Train 1 isolated Chromium acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/renaissance-browser-acceptance.yml"
      - "scripts/renaissance-browser-acceptance.cjs"
      - "app/kingdom-intelligence/**"
      - "app/game-stats/**"
      - "app/admin/aoe2war-os/**"
      - "app/admin/layout.tsx"
      - "app/api/admin/aoe2war-os/route.ts"
      - "app/api/kingdom-intelligence/live-recovery/route.ts"
      - "tests/kingdom-intelligence-recovery-runtime.test.mts"
      - "config/kingdom-index-routes.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renaissance-chromium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-browser:
    name: Chromium — exact candidate, no production data or operator mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aoe2war_ci_no_server
      SESSION_SECRET: ci-local-browser-no-production-secret
      NEXTAUTH_SECRET: ci-local-browser-no-production-secret
      NEXTAUTH_URL: http://127.0.0.1:3137
      AOE2_BACKEND_UPSTREAM: http://127.0.0.1:39999
      BROWSER_BASE_URL: http://127.0.0.1:3137
      PW_HOME: ${{ runner.temp }}/renaissance-playwright
      AOE2WAR_BROWSER_EVIDENCE: ${{ runner.temp }}/renaissance-browser-evidence
      CI: "1"

    steps:
      - name: Check out the exact proposed source and ancestry
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node and dependencies
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: yarn
      - run: |
          set -euo pipefail
          corepack enable
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npx prisma generate

      - name: Install ephemeral pinned Chromium driver, outside application dependency tree
        run: |
          set -euo pipefail
          mkdir -p "$PW_HOME"
          npm install --prefix "$PW_HOME" --no-save --no-package-lock --ignore-scripts --audit=false --fund=false playwright@1.55.1
          "$PW_HOME/node_modules/.bin/playwright" install --with-deps chromium

      - name: Build exact candidate; no runtime preview credentials or live database
        run: |
          set -euo pipefail
          yarn build
          git rev-parse HEAD
          test -s .next/BUILD_ID

      - name: Run bounded, read-only browser proof against ephemeral Next runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$AOE2WAR_BROWSER_EVIDENCE"
          ./node_modules/.bin/next start -H 127.0.0.1 -p 3137 \
            >"$AOE2WAR_BROWSER_EVIDENCE/next-runtime.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 80); do
            if curl --silent --max-time 1 -o /dev/null "http://127.0.0.1:3137/game-stats/2147483648"; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Local candidate Next runtime stopped before becoming ready"
              exit 1
            fi
            sleep 1
          done
          node scripts/renaissance-browser-acceptance.cjs
          git status --short

      - name: Upload candidate-bound browser receipts including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renaissance-browser-proof-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/renaissance-browser-evidence
