name: Held manual CI dispatch documentation seal
on:
  push:
    branches:
      - ops/exact-head-ci-dispatch-20261022
permissions:
  contents: write
concurrency:
  group: held-ci-dispatch-docs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  seal:
    if: github.repository == 'Emaren/app-prodn' && github.ref == 'refs/heads/ops/exact-head-ci-dispatch-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Seal exact reviewed implementation; change generated docs only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = ops/exact-head-ci-dispatch-20261022
          if python3 scripts/docs_v2_check.py; then
            echo "Already source-sealed"
            exit 0
          fi
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 scripts/docs_v2_check.py
          git diff --check
          paths="$(git diff --name-only)"
          test -n "$paths"
          while IFS= read -r path; do
            case "$path" in
              docs/document-registry.json|docs/DOCUMENTATION_CONTROL_PLANE.md|catalog-info.yaml) ;;
              *) echo "REFUSE non-generated path: $path" >&2; exit 1 ;;
            esac
          done <<< "$paths"
          git add docs/document-registry.json docs/DOCUMENTATION_CONTROL_PLANE.md catalog-info.yaml
          git config user.name 'aoe2war-held-document-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(ops): bind read-only CI dispatch to reviewed source SHA"
          git push origin HEAD:refs/heads/ops/exact-head-ci-dispatch-20261022
