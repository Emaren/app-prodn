name: R16 W1_SAFE immutable-source DocsV2 baseline
on:
  push:
    branches: [r16-w1safe-docsv2-pinned]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compute source-bound baseline for immutable pre-generator commit
        run: |
          python3 scripts/docs_v2_check.py --write --refresh-baseline --head 1f93835a4467c55a249dd3b77dda72d716895ebd --branch r16-w1safe-integrated
      - name: Self-retire, commit, THEN verify canonical final Git tree
        run: |
          git config user.name 'aoe2war-docsv2-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r16-w1safe-docsv2-pinned.yml
          git add docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json
          git diff --cached --stat
          git diff --cached --quiet && exit 1
          git commit -m 'docs(R16): exact W1_SAFE source baseline without generator-workflow contamination'
          python3 scripts/docs_v2_check.py
          git push origin HEAD:refs/heads/r16-w1safe-docsv2-pinned
