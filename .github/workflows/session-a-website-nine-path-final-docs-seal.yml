name: One-shot Session A exact nine-path website deployment DocsV2 seal
on:
  push:
    branches:
      - session-a/20261024-website-nine-path-operational-finish
permissions:
  contents: write
concurrency:
  group: session-a-exact-nine-path-release-docs-seal
  cancel-in-progress: false
jobs:
  seal-retire:
    if: github.repository == 'Emaren/app-prodn' && github.ref == 'refs/heads/session-a/20261024-website-nine-path-operational-finish'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Remove own workflow before generating exact implementation source baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/session-a/20261024-website-nine-path-operational-finish"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/session-a-website-nine-path-final-docs-seal.yml
          git commit -m "ci: retire temporary nine-path website DocsV2 sealer"
      - name: Regenerate strictly canonical DocsV2 source inventory
        run: |
          set -euo pipefail
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 - <<'PY'
          import subprocess
          allowed={"docs/document-registry.json","docs/DOCUMENTATION_CONTROL_PLANE.md","catalog-info.yaml"}
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          untracked=set(subprocess.check_output(["git","ls-files","--others","--exclude-standard"],text=True).splitlines())
          if not changed or (changed|untracked)-allowed:
              raise SystemExit("Unexpected DocsV2 source-seal changes: "+str(sorted(changed|untracked)))
          print("Exact generated docs:",sorted(changed))
          PY
          python3 scripts/docs_v2_check.py
      - name: Push only governed DocsV2 receipt files to isolated branch
        run: |
          set -euo pipefail
          git add -- docs/document-registry.json docs/DOCUMENTATION_CONTROL_PLANE.md catalog-info.yaml
          git diff --cached --quiet && exit 2
          git commit -m "docs(control): seal exact nine-path website-only release finish"
          git push origin HEAD:refs/heads/session-a/20261024-website-nine-path-operational-finish
