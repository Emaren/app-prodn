name: PRODUCT boundary source and negative authorization
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product-boundary:
    name: product-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BOUNDARY_REPOSITORY: ${{ github.repository }}
      BOUNDARY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BOUNDARY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      BOUNDARY_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout EXACT reviewed source (no credentials retained)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use deterministic Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Positive and adversarial negative authorization cases
        run: python3 -I -B -m unittest discover -s tests -p 'test_product_boundary_guard.py' -v
      - name: Source-bound owner signature, CI, artifact, rollback, nonce negatives
        run: python3 -I -B -m unittest discover -s tests -p 'test_product_signed_promotion_gate.py' -v
      # C PRODUCT's exact namespace contract must remain untouched. B release
      # source has an independently reviewed, different command/SQL boundary.
      # Never feed B's scripts/release fixtures to C's restricted argv/paths
      # filter or broaden its C-only allowlist. Fork impersonations run C's
      # original check, not this B-specific scope.
      - name: Source SHA, exact owner/origin, tree and approved C source changes
        if: >-
          (github.event_name != 'push' ||
           github.ref != 'refs/heads/main' ||
           github.event.before != 'a61c5af90fe77f10e0b6d1c6c680641ba37acc7a') &&
          (github.event_name != 'pull_request' ||
           (github.head_ref != 'session-b/v22-root-executor-and-c-artifact-contract-20261111' &&
            github.head_ref != 'session-b/steam-v23-lease-expiry-race-repair-20261112' &&
            github.head_ref != 'session-b/steam-v23-c03-observer-completion-retry-20261112' &&
             github.head_ref != 'session-b/steam-w1-fourunit-quarantine-requal-20261113') ||
           github.event.pull_request.head.repo.full_name != github.repository)
        run: python3 -I -B scripts/product_boundary_guard.py --check
      - name: Source SHA, exact canonical main ancestry and protected B-only release boundary
        if: >-
          github.event_name == 'pull_request' &&
          (github.head_ref == 'session-b/v22-root-executor-and-c-artifact-contract-20261111' ||
           github.head_ref == 'session-b/steam-v23-lease-expiry-race-repair-20261112' ||
           github.head_ref == 'session-b/steam-v23-c03-observer-completion-retry-20261112' ||
            github.head_ref == 'session-b/steam-w1-fourunit-quarantine-requal-20261113') &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$BOUNDARY_REPOSITORY" = Emaren/app-prodn
          case "$BOUNDARY_BRANCH" in
            session-b/v22-root-executor-and-c-artifact-contract-20261111|session-b/steam-v23-lease-expiry-race-repair-20261112|session-b/steam-v23-c03-observer-completion-retry-20261112|session-b/steam-w1-fourunit-quarantine-requal-20261113) ;;
            *) echo HOLD:B_RELEASE_BRANCH_UNAUTHORIZED; exit 3 ;;
          esac
          test "${{ github.event.pull_request.base.ref }}" = main
          test "$(git rev-parse HEAD)" = "$BOUNDARY_HEAD_SHA"
          test "$(git remote get-url origin)" = https://github.com/Emaren/app-prodn
          git merge-base --is-ancestor "$BOUNDARY_BASE_SHA" HEAD
          # A stale PR base is NOT current main; source must be reconciled.
          actual_main="$(gh api "repos/$BOUNDARY_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$actual_main" = "$BOUNDARY_BASE_SHA"
          # Compare the exact B branch against *actual main*, not an old
          # stacked B parent. Preserve C and A namespaces by deny-by-default.
          # This one later Steam race repair must contain ONLY these exact paths
          # and SHA-reviewed Python bytes. Do not broaden C's original guard.
          if [ "$BOUNDARY_BRANCH" = session-b/steam-v23-lease-expiry-race-repair-20261112 ]; then
            exact_paths="$(printf '%s\n' \
              '.github/workflows/product-boundary.yml' \
              'scripts/release/r25_steam_refresh_current_product_v23.py' \
              'tests/test_r25_steam_v23_bounded_expiry_repair.py' \
              'tests/test_r25_b_product_mainline_scope.py' \
              'docs/DOCUMENTATION_CONTROL_PLANE.md' \
              'docs/document-registry.json' | LC_ALL=C sort)"
            actual_paths="$(git diff --name-only "$BOUNDARY_BASE_SHA" HEAD -- | LC_ALL=C sort)"
            test "$actual_paths" = "$exact_paths" || {
              echo HOLD:B_V23_REPAIR_SOURCE_SCOPE; exit 3;
            }
            test "$(sha256sum scripts/release/r25_steam_refresh_current_product_v23.py | cut -d' ' -f1)" = '5747e59c783acca1ed0c7e3f1c2b032eed9036fc0deb176728af2d6417019bce' || exit 3
            test "$(sha256sum tests/test_r25_steam_v23_bounded_expiry_repair.py | cut -d' ' -f1)" = '732ff45d0cfd445ca4ea2d3a636144888b7af7b26789e35062d03424657c5f8d' || exit 3
            test "$(sha256sum tests/test_r25_b_product_mainline_scope.py | cut -d' ' -f1)" = '825035f4f0124803e5284d959d65f02ec0ae32638377d2c240ac19a6e6a6979d' || exit 3
          fi
          # B-only C03 observer collision: allow exactly these reviewed,
          # content-addressed files. C UID650 original guard stays strict.
          if [ "$BOUNDARY_BRANCH" = session-b/steam-v23-c03-observer-completion-retry-20261112 ]; then
            exact_paths="$(printf '%s\n' \
              '.github/workflows/product-boundary.yml' \
              'scripts/release/r25_steam_refresh_current_product_v23.py' \
              'tests/test_r25_steam_v23_bounded_expiry_repair.py' \
              'tests/test_r25_steam_v23_c03_observer_completion.py' \
              'tests/test_r25_b_product_mainline_scope.py' \
              'docs/DOCUMENTATION_CONTROL_PLANE.md' \
              'docs/document-registry.json' | LC_ALL=C sort)"
            actual_paths="$(git diff --name-only "$BOUNDARY_BASE_SHA" HEAD -- | LC_ALL=C sort)"
            test "$actual_paths" = "$exact_paths" || {
              echo HOLD:B_V23_C03_OBSERVER_SOURCE_SCOPE; exit 3;
            }
            test "$(sha256sum scripts/release/r25_steam_refresh_current_product_v23.py | cut -d' ' -f1)" = '3bb7f065a46e4c1d31ca70a9a30df1c8efbafeca72d95e0d89a37c04e221c5cc' || exit 3
            test "$(sha256sum tests/test_r25_steam_v23_bounded_expiry_repair.py | cut -d' ' -f1)" = '1f26bd44011d82dc88308d6c7a472c0322a48ad7e57d38920cc7b752701c3c32' || exit 3
            test "$(sha256sum tests/test_r25_steam_v23_c03_observer_completion.py | cut -d' ' -f1)" = 'e23bc70d1b13c053dd2e3082afe8a24b371574cdd2ade82452e70fe418b1fb46' || exit 3
            test "$(sha256sum tests/test_r25_b_product_mainline_scope.py | cut -d' ' -f1)" = '145d8f299371aec5d8093ba0ab21b0047e17e3350d1abea61b7aa6bb891c6302' || exit 3
          fi
          # Exact W1 four-mask B-owned source-only review. This does NOT
          # add B branches to C's restricted PRODUCT guard or grant root access.
          if [ "$BOUNDARY_BRANCH" = session-b/steam-w1-fourunit-quarantine-requal-20261113 ]; then
            exact_paths="$(printf '%s\n' \
              '.github/workflows/product-boundary.yml' \
              'scripts/release/r25_steam_w1_four_mask_guard_v1.py' \
              'tests/test_r25_steam_w1_four_mask_guard_v1.py' \
              'tests/test_r25_steam_w1_chain_v1.py' \
              'tests/test_r25_b_product_mainline_scope.py' \
              'docs/EVIDENCE_VAULT.md' \
              'docs/HOST_MAINTENANCE.md' \
              'docs/MARKETPLACE_BUSINESS.md' \
              'docs/PLAYER_WAR_ARCHIVE_OPERATIONS.md' \
              'docs/STORAGE_OS.md' \
              'docs/DOCUMENTATION_CONTROL_PLANE.md' \
              'docs/document-registry.json' | LC_ALL=C sort)"
            actual_paths="$(git diff --name-only "$BOUNDARY_BASE_SHA" HEAD -- | LC_ALL=C sort)"
            test "$actual_paths" = "$exact_paths" || {
              echo HOLD:B_W1_FOUR_MASK_SOURCE_SCOPE; exit 3;
            }
            test "$(sha256sum scripts/release/r25_steam_w1_four_mask_guard_v1.py | cut -d' ' -f1)" = '97b93c24eee5ddd21bc909bb4d7babe3a9986daf93b41df0ee628501b1ad1e23' || exit 3
            test "$(sha256sum tests/test_r25_steam_w1_four_mask_guard_v1.py | cut -d' ' -f1)" = '8cfad202d455deb3eab659c889618ef9b844733208da540f72516caeb8158381' || exit 3
            test "$(sha256sum tests/test_r25_b_product_mainline_scope.py | cut -d' ' -f1)" = '9e64aabacdfe46412768247b2d8e59200327e74672927eb722c5b451f69fb762' || exit 3
            # Exact, independently reviewed 2026-11-13 DocsV2 text copied
            # byte-for-byte from admitted Factory SHA 2a5544f; not new reviews.
            test "$(git hash-object docs/EVIDENCE_VAULT.md)" = '08126875f80ea2070f176e3f0b88e3b82afc61a0' || exit 3
            test "$(git hash-object docs/HOST_MAINTENANCE.md)" = '2ba23779332ea078e132238543a53e3de5103c9b' || exit 3
            test "$(git hash-object docs/MARKETPLACE_BUSINESS.md)" = 'c9c720a193d9949814750b3a49ff17483161f7f1' || exit 3
            test "$(git hash-object docs/PLAYER_WAR_ARCHIVE_OPERATIONS.md)" = 'c5dd227948b6889e236a8c8b21be35de12ded340' || exit 3
            test "$(git hash-object docs/STORAGE_OS.md)" = 'e63afed852c70fefb173b71b7097d1f686e57c29' || exit 3
            test "$(sha256sum tests/test_r25_steam_w1_chain_v1.py | cut -d' ' -f1)" = '3ecd32017458ee6cff50e3d6549ecf25f0086f4c486bafbda6b0a907090912d1' || exit 3
            python3 -B -m unittest -q tests.test_r25_steam_w1_four_mask_guard_v1 tests.test_r25_steam_w1_chain_v1
            echo PASS:B_EXACT_W1_FOUR_MASK_SOURCE_ONLY_POLICY_NO_ROOT_INSTALL
          fi
          git diff --name-only --diff-filter=ACMRTUXB -z "$BOUNDARY_BASE_SHA" HEAD -- > "$RUNNER_TEMP/b-product-source-paths.nul"
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/security/*|prisma/*|systemd/*|infra/*|ops/*|scripts/product_*|tests/test_product_*)
                echo "HOLD:B_MAINLINE_C_PRODUCT_OR_FINANCIAL_SOURCE_DRIFT:$path"
                exit 3 ;;
              app/api/admin/wolo*|app/api/admin/bets*|app/api/admin/bount*|app/api/admin/championship*|app/api/admin/oracle*|app/api/user/war-satchel*|app/api/user/wolo*|app/api/user/bet-automation*)
                echo "HOLD:B_MAINLINE_FINANCIAL_HANDLER_DRIFT:$path"
                exit 3 ;;
            esac
            case "$path" in
              .github/workflows/product-boundary.yml|.github/workflows/r25-b-source-pinned-linux-release-build-v2.yml|.github/workflows/r25-b-v22-root-and-uid650-handoff-ci.yml|.github/workflows/r25-public-player-one-use-controller-ci.yml|.github/workflows/r25-steam-dual-web-builds-v22-ci.yml|.github/workflows/r25-v22-three-source-transaction-review-ci.yml)
                ;;
              .github/workflows/*)
                echo "HOLD:B_UNREVIEWED_WORKFLOW:$path"; exit 3 ;;
              scripts/release/*)
                case "$path" in
                  *.py|*.service|scripts/release/r25_b_c03_nonfinancial_sidecar_SCHEMA_REVIEW_ONLY.sql) ;;
                  *) echo "HOLD:B_UNREVIEWED_RELEASE_EXECUTABLE:$path"; exit 3 ;;
                esac ;;
              app/api/*)
                case "$path" in
                  app/api/auth/session/route.ts|app/api/auth/steam/route.ts|app/api/user/me/route.ts|app/api/user/ping/route.ts|app/api/user/appearance/route.ts|app/api/user/language/route.ts|app/api/user/register/route.ts|app/api/user/update_name/route.ts|app/api/admin/delete_user/*/route.ts) ;;
                  *) echo "HOLD:B_UNREVIEWED_API_AUTHORITY:$path"; exit 3 ;;
                esac ;;
              lib/*)
                case "$path" in
                  lib/c03*|lib/adminSession.ts|lib/productionAuth.ts|lib/playerNormalizedStats.ts) ;;
                  *) echo "HOLD:B_UNREVIEWED_RUNTIME_LIBRARY:$path"; exit 3 ;;
                esac ;;
              docs/*|tests/*|components/players/PlayerProfilePage.tsx|config/kingdom-index-routes.json)
                ;;
              *)
                echo "HOLD:B_UNREVIEWED_SOURCE_PATH:$path"; exit 3 ;;
            esac
            case "$path" in
              */financial/*|financial/*|*/FINANCIAL/*|FINANCIAL/*|*/finance/*|finance/*|*owner-private-recovery*|*private_keys*|*secrets*|*.pem|*.key|*.p12)
                echo "HOLD:B_FINANCIAL_OR_PRIVATE_AUTHORITY_PATH:$path"; exit 3 ;;
            esac
          done < "$RUNNER_TEMP/b-product-source-paths.nul"
          python3 -B -m unittest -q tests.test_r25_b_product_mainline_scope
          python3 -B -m unittest -q tests.test_r25_b_v22_root_install_admission_review tests.test_r25_b_v22_central_signature_review tests.test_r25_b_c03_website_source_admission
          echo PASS:B_MAINLINE_CURRENT_SOURCE_AND_SEPARATE_RESTRICTED_RELEASE_BOUNDARY
      # The same B-only source must survive a merge into canonical main.
      # Without this path, C's guard incorrectly rejects known B release
      # files on push even though PR CI was green. This exception accepts
      # EXACTLY the one reviewed #1338 merge: immutable parent, actual GitHub
      # PR merge SHA, second parent = exact PR head, seven paths, four pinned
      # source/test hashes. Any other push stays in C's original strict guard.
      - name: Verify exact reviewed B PR1338 merge into main without widening C
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.event.before == 'a61c5af90fe77f10e0b6d1c6c680641ba37acc7a'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$BOUNDARY_REPOSITORY" = Emaren/app-prodn || exit 3
          test "$BOUNDARY_BRANCH" = main || exit 3
          test "$BOUNDARY_BASE_SHA" = a61c5af90fe77f10e0b6d1c6c680641ba37acc7a || exit 3
          test "$(git rev-parse HEAD)" = "$BOUNDARY_HEAD_SHA" || exit 3
          test "$(git rev-parse HEAD^1)" = "$BOUNDARY_BASE_SHA" || {
            echo HOLD:B_MAIN_PUSH_WRONG_MERGE_PROVENANCE; exit 3;
          }
          reviewed_pr_head="$(gh api "repos/$BOUNDARY_REPOSITORY/pulls/1338" --jq '.head.sha')"
          reviewed_merge_sha="$(gh api "repos/$BOUNDARY_REPOSITORY/pulls/1338" --jq '.merge_commit_sha')"
          reviewed_merged="$(gh api "repos/$BOUNDARY_REPOSITORY/pulls/1338" --jq '.merged')"
          test "$reviewed_merged" = true || exit 3
          test "$reviewed_pr_head" = "$(git rev-parse HEAD^2)" || {
            echo HOLD:B_MAIN_PUSH_WRONG_MERGE_PROVENANCE; exit 3;
          }
          test "$reviewed_merge_sha" = "$BOUNDARY_HEAD_SHA" || {
            echo HOLD:B_MAIN_PUSH_WRONG_MERGE_PROVENANCE; exit 3;
          }
          expected_paths="$(printf '%s\n' \
            '.github/workflows/product-boundary.yml' \
            'scripts/release/r25_steam_refresh_current_product_v23.py' \
            'tests/test_r25_steam_v23_bounded_expiry_repair.py' \
            'tests/test_r25_steam_v23_c03_observer_completion.py' \
            'tests/test_r25_b_product_mainline_scope.py' \
            'docs/DOCUMENTATION_CONTROL_PLANE.md' \
            'docs/document-registry.json' | LC_ALL=C sort)"
          actual_paths="$(git diff --name-only "$BOUNDARY_BASE_SHA" HEAD -- | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths" || {
            echo HOLD:B_MAIN_PUSH_SOURCE_SCOPE; exit 3;
          }
          test "$(sha256sum scripts/release/r25_steam_refresh_current_product_v23.py | cut -d' ' -f1)" = '3bb7f065a46e4c1d31ca70a9a30df1c8efbafeca72d95e0d89a37c04e221c5cc' || exit 3
          test "$(sha256sum tests/test_r25_steam_v23_bounded_expiry_repair.py | cut -d' ' -f1)" = '1f26bd44011d82dc88308d6c7a472c0322a48ad7e57d38920cc7b752701c3c32' || exit 3
          test "$(sha256sum tests/test_r25_steam_v23_c03_observer_completion.py | cut -d' ' -f1)" = 'e23bc70d1b13c053dd2e3082afe8a24b371574cdd2ade82452e70fe418b1fb46' || exit 3
          test "$(sha256sum tests/test_r25_b_product_mainline_scope.py | cut -d' ' -f1)" = '145d8f299371aec5d8093ba0ab21b0047e17e3350d1abea61b7aa6bb891c6302' || exit 3
          python3 -B -m unittest -q tests.test_r25_steam_v23_c03_observer_completion tests.test_r25_steam_v23_bounded_expiry_repair tests.test_r25_b_product_mainline_scope
          echo PASS:B_EXACT_MERGED_NONFINANCIAL_SOURCE_AND_C_ORIGINAL_GUARD_PRESERVED
