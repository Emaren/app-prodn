name: Temporary nine-path operator transport and enrollment DocsV2 seal
on:
  push:
    branches: [session-a/20261024-website-nine-path-operational-finish]
permissions:
  contents: write
concurrency:
  group: session-a-20261025-operator-enrollment-seal
  cancel-in-progress: false
jobs:
  seal-and-retire:
    if: github.repository == 'Emaren/app-prodn' && github.ref == 'refs/heads/session-a/20261024-website-nine-path-operational-finish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Remove this temporary workflow before computing real code baseline
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/session-a-20261025-operator-enrollment-seal.yml
          git commit -m 'ci: retire temporary public enrollment and transport docs seal'
      - name: Regenerate bounded DocsV2 and require no unexpected generated source
        run: |
          set -euo pipefail
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 - <<'PY'
          import subprocess
          allowed={'docs/document-registry.json','docs/DOCUMENTATION_CONTROL_PLANE.md','catalog-info.yaml'}
          changes=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          new=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          if not changes or (changes|new)-allowed:
              raise SystemExit(f'UNEXPECTED_DOCS_SOURCE_DRIFT={sorted(changes|new)}')
          print('ONLY_CANONICAL_DOCSV2=',sorted(changes))
          PY
          python3 scripts/docs_v2_check.py
      - name: Commit source-bound governed docs to operator-only review branch
        run: |
          set -euo pipefail
          git add -- docs/document-registry.json docs/DOCUMENTATION_CONTROL_PLANE.md catalog-info.yaml
          git diff --cached --quiet && exit 2
          git commit -m 'docs(control): seal canonical SSH release principal and independent signer enrollment'
          git push origin HEAD:refs/heads/session-a/20261024-website-nine-path-operational-finish
