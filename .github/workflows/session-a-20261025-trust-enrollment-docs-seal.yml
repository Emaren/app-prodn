name: One-shot Session A Mac trust enrollment DocsV2 seal
on:
  push:
    branches:
      - session-a/20261024-website-nine-path-operational-finish
permissions:
  contents: write
concurrency:
  group: session-a-trust-enrollment-docs-v2
  cancel-in-progress: false
jobs:
  seal-and-retire:
    if: github.repository == 'Emaren/app-prodn' && github.ref == 'refs/heads/session-a/20261024-website-nine-path-operational-finish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retire one-shot workflow before exact source baseline generation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$GITHUB_REF" = "refs/heads/session-a/20261024-website-nine-path-operational-finish"
          git rm -- .github/workflows/session-a-20261025-trust-enrollment-docs-seal.yml
          git commit -m 'ci: retire temporary Mac trust enrollment source seal'
      - name: Generate governed documentation and verify bounded scope
        run: |
          set -euo pipefail
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 - <<'PY'
          import subprocess
          allowed={'docs/document-registry.json','docs/DOCUMENTATION_CONTROL_PLANE.md','catalog-info.yaml'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          if not changed or (changed|untracked)-allowed:
              raise SystemExit('UNEXPECTED_DOCS_V2_CHANGES='+str(sorted(changed|untracked)))
          print('CANONICAL_DOCS_V2_RESEAL=',sorted(changed))
          PY
          python3 scripts/docs_v2_check.py
      - name: Commit only canonical registered documents to Session A branch
        run: |
          set -euo pipefail
          git add -- docs/document-registry.json docs/DOCUMENTATION_CONTROL_PLANE.md catalog-info.yaml
          git diff --cached --quiet && exit 2
          git commit -m 'docs(control): seal Mac-local trust enrollment, signed VPS witness and nonauthorizing quorum proposal'
          git push origin HEAD:refs/heads/session-a/20261024-website-nine-path-operational-finish
