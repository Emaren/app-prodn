name: One-shot Final Mac Trust/Witness Runbook DocsV2 Seal
on:
  push:
    branches: [session-a/20261024-website-nine-path-operational-finish]
permissions:
  contents: write
concurrency:
  group: session-a-20261025-final-witness-handoff-seal
  cancel-in-progress: false
jobs:
  source-seal:
    if: github.repository == 'Emaren/app-prodn' && github.ref == 'refs/heads/session-a/20261024-website-nine-path-operational-finish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Remove one-shot workflow before measuring final source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$GITHUB_REF" = "refs/heads/session-a/20261024-website-nine-path-operational-finish"
          git rm .github/workflows/session-a-20261025-final-witness-handoff-seal.yml
          git commit -m 'ci: retire temporary final Mac trust/witness DocsV2 sealer'
      - name: Refresh only canonical source governed DocsV2
        run: |
          set -euo pipefail
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 - <<'PY'
          import subprocess
          allowed={'docs/document-registry.json','docs/DOCUMENTATION_CONTROL_PLANE.md','catalog-info.yaml'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          if not changed or (changed|untracked)-allowed:
              raise SystemExit('UNEXPECTED_DOCS_GENERATION='+str(sorted(changed|untracked)))
          print('SOURCE_BOUND_DOCSV2=',sorted(changed))
          PY
          python3 scripts/docs_v2_check.py
      - name: Commit governed indexes to Session A isolated branch only
        run: |
          set -euo pipefail
          git add -- docs/document-registry.json docs/DOCUMENTATION_CONTROL_PLANE.md catalog-info.yaml
          git diff --cached --quiet && exit 2
          git commit -m 'docs(control): final Mac trust/witness quorum proposal tests source seal'
          git push origin HEAD:refs/heads/session-a/20261024-website-nine-path-operational-finish
