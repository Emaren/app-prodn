name: One-shot F R10 exact native FD200 DocsV2 reseal
on:
  push:
    branches:
      - repair/g-r10-native-fd200-final-docs-20261030
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retire generator, seal full R10 source, verify exact docs-only diff
        shell: bash {0}
        run: |
          SOURCE=3388135b28b4f4cb89f86446df7f53a7ef2d48bb
          BRANCH=repair/g-r10-native-fd200-final-docs-20261030
          TEMP=.github/workflows/f-r10-final-fd200-docsv2.yml
          if [ "$(git rev-parse HEAD^)" != "$SOURCE" ] ||
             [ "$(git diff --name-only "$SOURCE" HEAD)" != "$TEMP" ]; then
            echo "HOLD: SOURCE_OR_GENERATOR_CHANGED"
            exit 2
          fi
          git switch -C "$BRANCH" || exit 2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- "$TEMP" || exit 2
          git commit -m "chore(R10): retire final FD200 DocsV2 generator" || exit 2
          BASELINE=$(git rev-parse HEAD)
          python3 scripts/docs_v2_check.py --write --refresh-baseline --branch "$BRANCH" --head "$BASELINE" || exit 2
          git add -- docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json || exit 2
          DIFF=$(git diff --cached --name-only)
          EXPECTED=$(printf '%s\n' docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json)
          if [ "$DIFF" != "$EXPECTED" ]; then
            echo "HOLD: NONCANONICAL_GENERATED_DIFF $DIFF"
            exit 2
          fi
          git commit -m "docs(R10): exact native FD200 final source registry/index" || exit 2
          python3 scripts/docs_v2_check.py || exit 2
          if [ -n "$(git status --porcelain)" ]; then
            echo "HOLD: NOT_CLEAN"
            exit 2
          fi
          git push origin "HEAD:refs/heads/$BRANCH" || exit 2
          echo "PASS: CANONICAL_DOCSV2_ON_EXACT_REVIEWED_F_R10_SOURCE"
