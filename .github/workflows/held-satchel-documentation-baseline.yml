name: Held Satchel documentation baseline refresh
on:
  push:
    branches:
      - codex/20261022-satchel-final-mainnet-recovery-held
      - integration/20261022-final-mainnet-github-held
      - integration/20261022-satchel-mainline-held
      - integration/20261022-codex-regressions-held
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: held-satchel-docs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  baseline:
    if: github.repository == 'Emaren/app-prodn' && github.ref == 'refs/heads/integration/20261022-codex-regressions-held'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Review and refresh documentation only for changed protected source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = integration/20261022-codex-regressions-held
          if python3 scripts/docs_v2_check.py; then
            echo "Document control already certified for this source revision."
            exit 0
          fi
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 scripts/docs_v2_check.py
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "No documentation delta; refusing empty refresh."
            exit 1
          fi
          while IFS= read -r path; do
            case "$path" in
              docs/document-registry.json|docs/DOCUMENTATION_CONTROL_PLANE.md|catalog-info.yaml) ;;
              *) echo "Unexpected generated path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git diff --check
          git add docs/document-registry.json docs/DOCUMENTATION_CONTROL_PLANE.md catalog-info.yaml
          git config user.name 'aoe2war-held-document-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(held): seal reviewed Satchel source implementation baseline"
          git push origin HEAD:refs/heads/integration/20261022-codex-regressions-held
