name: One-shot protected website-only controller DocsV2 source seal
on:
  push:
    branches:
      - session-a/20261024-website-protected-release-controller

permissions:
  contents: write

concurrency:
  group: session-a-website-controller-v2-docsv2-seal
  cancel-in-progress: false

jobs:
  seal-and-self-retire:
    if: github.repository == 'Emaren/app-prodn' && github.ref == 'refs/heads/session-a/20261024-website-protected-release-controller'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Remove temporary workflow before computing final implementation baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/session-a/20261024-website-protected-release-controller"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/session-a-website-controller-v2-final-docs-seal.yml
          git commit -m "ci: retire temporary site authority docs seal before implementation source hash"
      - name: Generate only canonical governed DocsV2 indexes
        run: |
          set -euo pipefail
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 - <<'PY'
          import subprocess
          allowed={"docs/document-registry.json","docs/DOCUMENTATION_CONTROL_PLANE.md","catalog-info.yaml"}
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          untracked=set(subprocess.check_output(["git","ls-files","--others","--exclude-standard"],text=True).splitlines())
          if not changed or (changed|untracked)-allowed:
              raise SystemExit("Unexpected or empty DocsV2 changes: "+str(sorted(changed|untracked)))
          print("Source-sealed docs paths:",sorted(changed))
          PY
          python3 scripts/docs_v2_check.py
      - name: Commit generated documentation only to original isolated branch
        run: |
          set -euo pipefail
          git add -- docs/document-registry.json docs/DOCUMENTATION_CONTROL_PLANE.md catalog-info.yaml
          git diff --cached --quiet && exit 2
          git commit -m "docs(control): seal independently reviewed website-only protected dispatcher"
          git push origin HEAD:refs/heads/session-a/20261024-website-protected-release-controller
