name: Q19 G frozen 648bdc4a canonical DocsV2 refresh
on:
  push:
    branches:
      - repair/g-docsv2-frozen-648bdc4a-20261030
    paths:
      - .github/workflows/g-frozen-648bdc4a-docsv2-once.yml

permissions:
  contents: write

jobs:
  refresh:
    name: Regenerate 105 DocsV2 documents from F frozen ancestry
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify frozen source and remove temporary generator before baseline
        run: |
          git switch -C repair/g-docsv2-frozen-648bdc4a-20261030
          git merge-base --is-ancestor 648bdc4a613e80be51e8f6592ec8eec4e93416ea HEAD || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/g-frozen-648bdc4a-docsv2-once.yml
          git commit -m "chore(Q19): retire temporary canonical DocsV2 generator"
      - name: Canonical implementation-baseline and registry refresh
        run: |
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json)"
          if [ "$actual" != "$expected" ]; then
            printf 'HOLD: unexpected generated paths:\n%s\n' "$actual"
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('docs/document-registry.json').read_text())
          documents = registry['documents']
          if len(documents) != 105:
              raise SystemExit('HOLD: expected exactly 105 source documents, got %d' % len(documents))
          paths = {d['path'] for d in documents}
          for doc in (
              'docs/SOLO_OWNER_W1_WEBSITE_ADMISSION.md',
              'docs/SOLO_OWNER_WEBSITE_RELEASE_V1_OPERATOR_RUNBOOK.md',
              'docs/SOLO_WEBSITE_CAPACITY_RECOVERY_DECISION_V1.md'
          ):
              if doc not in paths: raise SystemExit('HOLD: missing source document ' + doc)
          contract = Path('docs/SOLO_OWNER_W1_WEBSITE_ADMISSION.md').read_text()
          if 'G production browser acceptance' not in contract or '375, 768 and 1440 CSS pixels' not in contract:
              raise SystemExit('HOLD: authenticated seven-interface production acceptance lost')
          print('PASS: 105 source documents, G acceptance preserved; implementation baseline:', registry['implementation_baseline'])
          PY
          git diff --stat
      - name: Commit only canonical generator outputs and strict recheck
        run: |
          git add docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json
          git commit -m "docs(Q19): refresh exact frozen F implementation baseline and 105-document registry"
          python3 scripts/docs_v2_check.py
          git diff --exit-code
          git status --porcelain
          git push origin HEAD:repair/g-docsv2-frozen-648bdc4a-20261030
