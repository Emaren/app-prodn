name: One-shot closed-source Satchel test DocsV2 seal (no release)

on:
  push:
    branches:
      - integration/20261023-satchel-final-gated

permissions:
  contents: write

concurrency:
  group: one-shot-held-satchel-pin-test-20261023
  cancel-in-progress: false

jobs:
  seal-then-retire:
    if: github.repository == 'Emaren/app-prodn' && github.ref == 'refs/heads/integration/20261023-satchel-final-gated'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retire this temporary privileged workflow first
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/satchel-test-pin-seal-once.yml
          git commit -m "ci(held): retire one-time Satchel test-pin sealing helper"
      - name: Generate source-bound canonical documentation using project tooling
        run: |
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 - <<'PY'
          import subprocess
          permitted={'docs/document-registry.json','docs/DOCUMENTATION_CONTROL_PLANE.md','catalog-info.yaml'}
          dirty=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          unexpected=(dirty|untracked)-permitted
          if unexpected:
              raise SystemExit('Unexpected DocsV2 outputs '+repr(sorted(unexpected)))
          print('DocsV2 approved output', sorted(dirty))
          PY
          python3 scripts/docs_v2_check.py
          git add -- docs/document-registry.json docs/DOCUMENTATION_CONTROL_PLANE.md catalog-info.yaml
          git diff --cached --quiet || git commit -m "docs(held): seal reviewed binary pin and test source changes"
          git push origin HEAD:refs/heads/integration/20261023-satchel-final-gated
