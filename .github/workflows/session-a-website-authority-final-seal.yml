name: One-shot Session A DocsV2 seal for nonce-controlled website reviewer
on:
  push:
    branches:
      - session-a/website-authority-v2-20261024
permissions:
  contents: write
concurrency:
  group: session-a-website-auth-v2-final-seal
  cancel-in-progress: false
jobs:
  self-retire-and-seal:
    if: github.repository == 'Emaren/app-prodn' && github.ref == 'refs/heads/session-a/website-authority-v2-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Remove this temporary workflow before source baseline generation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/session-a/website-authority-v2-20261024"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/session-a-website-authority-final-seal.yml
          git commit -m "ci: retire Session A nonce-seal workflow from final tree"
      - name: Generate exact canonical DocsV2 seal only
        run: |
          set -euo pipefail
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 - <<'PY'
          import subprocess
          allowed={"docs/document-registry.json","docs/DOCUMENTATION_CONTROL_PLANE.md","catalog-info.yaml"}
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          untracked=set(subprocess.check_output(["git","ls-files","--others","--exclude-standard"],text=True).splitlines())
          if not changed or (changed|untracked)-allowed:
              raise SystemExit("Unexpected DocsV2 seal scope: "+str(sorted(changed|untracked)))
          print(sorted(changed))
          PY
          python3 scripts/docs_v2_check.py
      - name: Commit only canonical docs and push isolated branch
        run: |
          set -euo pipefail
          git add -- docs/document-registry.json docs/DOCUMENTATION_CONTROL_PLANE.md catalog-info.yaml
          git diff --cached --quiet && exit 2
          git commit -m "docs(control): seal durable nonce-controlled website review"
          git push origin HEAD:refs/heads/session-a/website-authority-v2-20261024
