name: R18 F website isolated finance/browser source seal
on:
  push:
    branches: [r18-f-website-docsv2-seal]
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Actual source noninterference and browser fail-closed tests
        run: |
          node --test tests/w1safe-r17-challenge-financial-read-boundary.test.mts
          python3 -m unittest discover -s tests -p 'test_renaissance_88_a11y_preview.py' -v
      - name: Remove one-shot generator BEFORE canonical DocsV2 source seal
        run: |
          git config user.name 'aoe2war-docsv2-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r18-f-website-docsv2-seal.yml
          git commit -m 'ci(R18 F): retire isolated source tests before docs seal'
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          git add docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json
          git diff --cached --quiet && exit 1
          git commit -m 'docs(R18 F): seal exact combined B financial/G browser source'
          python3 scripts/docs_v2_check.py
          git push origin HEAD:refs/heads/r18-f-website-docsv2-seal
