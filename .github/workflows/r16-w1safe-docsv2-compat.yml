name: R16 W1_SAFE compatible-lint DocsV2 final reseal
on:
  push:
    branches: [r16-w1safe-docsv2-compat]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Reseal genuine canonical B/G-reviewed source
        run: |
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 scripts/docs_v2_check.py
      - name: Publish only canonical docs and retire generator
        run: |
          git config user.name 'aoe2war-docsv2-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r16-w1safe-docsv2-compat.yml
          git add docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json
          git diff --cached --stat
          git diff --cached --quiet && exit 1
          git commit -m 'docs(R16): seal source-bound dependencies plus compatible lint prebuild'
          git push origin HEAD:refs/heads/r16-w1safe-docsv2-compat
