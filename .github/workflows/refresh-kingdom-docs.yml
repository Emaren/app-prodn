name: Refresh Kingdom instrumentation docs

on:
  push:
    branches:
      - feature/kingdom-brain-progress-foundation-20261019
    paths:
      - ".kingdom-doc-refresh-trigger"

permissions:
  contents: write

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact isolated candidate with full ancestry
        uses: actions/checkout@v4
        with:
          ref: feature/kingdom-brain-progress-foundation-20261019
          fetch-depth: 0
          persist-credentials: true

      - name: Regenerate governed documentation and exact implementation baseline
        run: |
          set -euo pipefail
          python3 scripts/docs_v2_check.py --write --refresh-baseline \
            --branch feature/kingdom-brain-progress-foundation-20261019 \
            --head "$(git rev-parse HEAD)"
          python3 scripts/docs_v2_check.py

      - name: Commit only generated documents
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/document-registry.json docs/DOCUMENTATION_CONTROL_PLANE.md catalog-info.yaml
          if ! git diff --cached --quiet; then
            git commit -m "docs(kingdom): seal exact instrumentation source baseline"
            git push origin HEAD:feature/kingdom-brain-progress-foundation-20261019
          fi
