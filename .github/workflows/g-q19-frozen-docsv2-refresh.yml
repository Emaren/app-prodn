name: Q19 G final DocsV2 baseline on frozen F
on:
  push:
    branches:
      - repair/g-docsv2-pr1008-20261030
    paths:
      - .github/workflows/g-q19-frozen-docsv2-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    name: Verify full F ancestry and regenerate canonical DocsV2
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate frozen F source is an ancestor and retire one-shot runner
        run: |
          git switch -C repair/g-docsv2-pr1008-20261030
          git merge-base --is-ancestor 54a9c78c740bb1a9129a0528a4cac5fdc2a5d375 HEAD || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/g-q19-frozen-docsv2-refresh.yml
          git commit -m "chore(Q19): retire one-shot final baseline generator"
      - name: Supported intentional implementation baseline refresh
        run: |
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json)"
          if [ "$actual" != "$expected" ]; then
            printf 'HOLD: unexpected generated paths:\n%s\n' "$actual"
            exit 1
          fi
          git diff --stat
          python3 - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('docs/document-registry.json').read_text())
          paths=[d['path'] for d in reg['documents']]
          for needed in ('docs/SOLO_OWNER_W1_WEBSITE_ADMISSION.md', 'docs/SOLO_OWNER_WEBSITE_RELEASE_V1_OPERATOR_RUNBOOK.md', 'docs/SOLO_WEBSITE_CAPACITY_RECOVERY_DECISION_V1.md'):
              if needed not in paths: raise SystemExit('HOLD: missing canonical Q19 doc '+needed)
          print('DOCSV2_REGISTRY_COUNT=',len(paths))
          print('FROZEN_F_ANCESTOR=54a9c78c740bb1a9129a0528a4cac5fdc2a5d375')
          print('BASELINE=',reg['implementation_baseline'])
          PY
      - name: Save ONLY canonical DocsV2 and verify strict checkout
        run: |
          git add docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json
          git commit -m "docs(Q19): seal full frozen F implementation and all current docs"
          python3 scripts/docs_v2_check.py
          git diff --exit-code
          git status --porcelain
          git push origin HEAD:repair/g-docsv2-pr1008-20261030
