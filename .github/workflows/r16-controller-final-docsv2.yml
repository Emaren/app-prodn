name: R16 integrated native controller DocsV2 source reseal
on:
  push:
    branches: [r16-controller-final-docsv2]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Canonical source-bound DocsV2 for controller exact head
        run: |
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 scripts/docs_v2_check.py
      - name: Self-retire generator and commit only canonical output
        run: |
          git config user.name 'aoe2war-docsv2-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r16-controller-final-docsv2.yml
          git add docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json
          git diff --cached --stat
          git diff --cached --quiet && exit 1
          git commit -m 'docs(R16): canonical source baseline for six-producer protected controller'
          git push origin HEAD:refs/heads/r16-controller-final-docsv2
