name: R18 F final C D native source-bound immutable seal
on:
  push:
    branches: [r18-f-controller-final-natives-seal]
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Recheck exact B/G website digest, C anti-replay install, D authentic source signer
        run: |
          python3 -m unittest discover -s tests -p 'test_r18_f_exact_integrated_identity.py' -v
          python3 -m unittest discover -s tests -p 'test_r17_f_fd200_preissue.py' -v
          python3 -m unittest discover -s tests -p 'test_aoe2_solo_root_install_v2.py' -v
          python3 -m unittest discover -s tests -p 'test_solo_native_producer_signer.py' -v
      - name: Self-retire one-shot before canonical new controller source seal
        run: |
          git config user.name 'aoe2war-docsv2-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r18-f-controller-final-natives-seal.yml
          git commit -m 'ci(R18 F): retire C/D final verifier before source seal'
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          git add docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json
          git diff --cached --quiet && exit 1
          git commit -m 'docs(R18 F): canonical B/G source pinned C/D/F native controller'
          python3 scripts/docs_v2_check.py
          git push origin HEAD:refs/heads/r18-f-controller-final-natives-seal
