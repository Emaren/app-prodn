name: Kingdom Index source census
on:
  workflow_dispatch:
  schedule:
    - cron: '19 6 * * *'
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'config/kingdom-index-routes.json'
      - 'scripts/kingdom_index_source_audit.mjs'
jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify all public routes and source revisions
        run: |
          set -euo pipefail
          node scripts/kingdom_index_source_audit.mjs --check | tee kingdom-index-census.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kingdom-index-source-census
          path: kingdom-index-census.json
          if-no-files-found: ignore
