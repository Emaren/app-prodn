name: C private Storage OS signed freshness Chrome
on:
  push:
    branches:
      - feat/c-storage-signed-freshness-20261029
  pull_request:
    paths:
      - 'lib/storageSignedFreshness.ts'
      - 'app/api/admin/storage-os/freshness/**'
      - 'components/storage-os/SignedFreshnessPanel.tsx'
      - 'app/admin/storage-os/page.tsx'
      - 'tests/private-storage-signed-freshness.test.mts'
      - 'scripts/c_storage_freshness_browser.cjs'
      - '.github/workflows/c-storage-signed-freshness-browser.yml'
permissions:
  contents: read
jobs:
  c-private-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DATABASE_URL: postgresql://renaissance_reader:local_fixture_only@127.0.0.1:55437/renaissance88
      SESSION_SECRET: isolated-ci-not-production
      NEXTAUTH_SECRET: isolated-ci-not-production
      NEXTAUTH_URL: http://localhost:3137
      C_FRESHNESS_BROWSER_ORIGIN: http://localhost:3137
      C_FRESHNESS_FIXTURE_ALLOWED: '1'
      AOE2WAR_PROD_DB_PREVIEW: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '22.22.0', cache: yarn }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Install exact dependencies (disposable test only)
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          corepack enable
          NODE_ENV=development YARN_PRODUCTION=false yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npm install --prefix "$RUNNER_TEMP/c-freshness-pw" --no-save --ignore-scripts playwright-core@1.57.0 axe-core@4.10.3
          npx prisma generate
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Hostile source contracts and existing signed C bridge
        run: |
          node --experimental-strip-types --test tests/private-storage-signed-freshness.test.mts tests/private-storage-visual-bridge.test.mts tests/private-storage-command-center.test.mts
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Disposable isolated PostgreSQL admin fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-client-16
          export AOE2WAR_TEST_PG_BIN=/usr/lib/postgresql/16/bin
          export REN88_PG_ROOT
          REN88_PG_ROOT="$(mktemp -d "$RUNNER_TEMP/c-freshness88-XXXXXX")"
          export RENAISSANCE_88_FIXTURE_ALLOWED=1
          printf '%s\n' "AOE2WAR_TEST_PG_BIN=$AOE2WAR_TEST_PG_BIN" "REN88_PG_ROOT=$REN88_PG_ROOT" "RENAISSANCE_88_FIXTURE_ALLOWED=1" >> "$GITHUB_ENV"
          bash scripts/renaissance_88_pg_fixture.sh start
          psql "postgresql://renaissance_owner@127.0.0.1:55437/renaissance88" -v ON_ERROR_STOP=1 -q -c "INSERT INTO users(uid,in_game_name,verified,is_admin,created_at) VALUES('fixture-admin','Fixture Admin',false,true,'2026-10-28T00:00:00Z')"
          bash scripts/renaissance_88_pg_fixture.sh snapshot
      - name: Exact source Next build and type gate
        run: |
          timeout -k 10s 30m yarn build
          test -s .next/BUILD_ID
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Actual authenticated Chrome and axe at 375 768 1440
        env:
          PW_HOME: ${{ runner.temp }}/c-freshness-pw
          C_FRESHNESS_BROWSER_OUT: ${{ runner.temp }}/c-storage-freshness-acceptance
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN" && test -x "$CHROME_BIN"
          export CHROME_BIN
          mkdir -p "$C_FRESHNESS_BROWSER_OUT"
          node ./node_modules/next/dist/bin/next start --hostname localhost --port 3137 > "$C_FRESHNESS_BROWSER_OUT/next.log" 2>&1 &
          next_pid=$!
          trap 'kill "$next_pid" 2>/dev/null || true; wait "$next_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 90); do
            kill -0 "$next_pid" 2>/dev/null || { cat "$C_FRESHNESS_BROWSER_OUT/next.log"; exit 2; }
            code="$(curl -sS --max-time 3 -o /dev/null -w '%{http_code}' http://localhost:3137/ || true)"
            if [ "$code" != 000 ]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          node scripts/c_storage_freshness_browser.cjs
          bash scripts/renaissance_88_pg_fixture.sh verify > "$C_FRESHNESS_BROWSER_OUT/fixture-after.txt"
          sha256sum .next/BUILD_ID "$C_FRESHNESS_BROWSER_OUT/receipt.json" > "$C_FRESHNESS_BROWSER_OUT/sha256.txt"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Stop fixture
        if: always()
        run: |
          if [ -n "${REN88_PG_ROOT:-}" ]; then
            bash scripts/renaissance_88_pg_fixture.sh stop || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c-signed-freshness-chrome-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c-storage-freshness-acceptance/
          retention-days: 14
          if-no-files-found: warn
