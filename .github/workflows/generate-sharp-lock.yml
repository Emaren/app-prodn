name: Generate sharp lock

on:
  push:
    branches:
      - fix/national-champions-art-challenge-20261006

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
      - name: Enable pinned package manager
        run: |
          corepack enable
          yarn --version
      - name: Generate lockfile
        run: yarn install --ignore-scripts --non-interactive
      - name: Show lock diff
        run: git diff -- package.json yarn.lock
      - uses: actions/upload-artifact@v4
        with:
          name: sharp-lock
          path: |
            package.json
            yarn.lock
