name: Generate sharp lock

on:
  push:
    branches:
      - fix/national-champions-art-challenge-20261006

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
      - name: Enable pinned package manager
        run: |
          corepack enable
          yarn --version
      - name: Generate lockfile
        run: yarn install --ignore-scripts --non-interactive
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- yarn.lock; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          git commit -m "Update sharp lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@v4
        with:
          name: sharp-lock
          path: |
            package.json
            yarn.lock
