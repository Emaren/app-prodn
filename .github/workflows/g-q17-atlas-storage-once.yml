name: G Q17 private Atlas Chrome exact source admission
on:
  push:
    branches:
      - review/g-storage-transfer-atlas-33-chrome-20261030
    paths:
      - .github/workflows/g-q17-atlas-storage-once.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
      - name: Pin post-W1 parent and retire temporary workflow before baseline
        run: |
          git switch -C review/g-storage-transfer-atlas-33-chrome-20261030
          git merge-base --is-ancestor 90dad4b2647d640bcde17ad9690cef8738fcb9bf HEAD || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/g-q17-atlas-storage-once.yml
          git commit -m "chore(Q17): retire one-shot post-W1 DocsV2 checker"
      - name: Verify actual 33 private source routes and canonical DocsV2
        run: |
          node --check tests/navigation-atlas-browser.cjs
          node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test tests/navigation-atlas-source.test.mts
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          docs=json.loads(Path("docs/document-registry.json").read_text())
          assert len(docs["documents"])==102,"Exact post-W1 canonical doc count changed"
          src=Path("tests/navigation-atlas-browser.cjs").read_text()
          assert 'approvedRoutes.length' in src and '"/admin/storage-transfer"' in src
          assert "adminNodes:32" not in src
          print("DOCSV2/ATLAS_SOURCE_PASS",docs["implementation_baseline"])
          PY
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json)"
          if [ "$actual" != "$expected" ]; then
            echo "HOLD: unexpected DocsV2 generator outputs"; printf '%s\n' "$actual"; exit 1
          fi
          git add docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json
          git commit -m "docs(Q17): exact post-W1 33-private-route Chrome acceptance baseline"
          python3 scripts/docs_v2_check.py
          git diff --exit-code
          git push origin HEAD:review/g-storage-transfer-atlas-33-chrome-20261030
      - name: Open draft review PR against Phase-1 feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh pr list --state all --head review/g-storage-transfer-atlas-33-chrome-20261030 --json number -q '.[0].number' || true)"
          if [ -n "$existing" ]; then
            echo "Existing Q17 review PR #$existing"
          else
            gh pr create --draft --base feature/storage-transfer-control-room-20261030 --head review/g-storage-transfer-atlas-33-chrome-20261030 \
              --title 'test(Q17): source-driven 33-route private Chrome acceptance for Storage Transfer' \
              --body 'Post-W1 only. The real 33rd private Storage Transfer route invalidated stale 32-route Q17 Chrome expectations; the test now verifies every exact source-owned edge, both storage search results, and the Command Tower cardinality. No implementation, admin authorization, money, F/W1 or production mutations. Canonical DocsV2 re-sealed against exact new test head. Full Q17 Chrome and 3-job CI required before reviewed merge.'
          fi
