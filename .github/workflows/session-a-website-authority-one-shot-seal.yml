name: One-shot isolated Session A website authority DocsV2 seal
on:
  push:
    branches:
      - session-a/website-authority-v2-20261024

permissions:
  contents: write

concurrency:
  group: session-a-website-auth-v2-seal
  cancel-in-progress: false

jobs:
  seal-and-retire:
    if: github.repository == 'Emaren/app-prodn' && github.ref == 'refs/heads/session-a/website-authority-v2-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Remove branch-only sealing workflow BEFORE final baseline
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git branch --show-current)" = "session-a/website-authority-v2-20261024"
          git rm -- .github/workflows/session-a-website-authority-one-shot-seal.yml
          git commit -m "ci: retire Session A temporary docs sealer before baseline"
      - name: Regenerate only source-bound canonical DocsV2 files
        run: |
          set -euo pipefail
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 - <<'PY'
          import subprocess
          allowed={"docs/document-registry.json", "docs/DOCUMENTATION_CONTROL_PLANE.md", "catalog-info.yaml"}
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          untracked=set(subprocess.check_output(["git","ls-files","--others","--exclude-standard"],text=True).splitlines())
          if not changed or (changed|untracked)-allowed:
              raise SystemExit("Unexpected or empty docs seal scope: "+str(sorted(changed|untracked)))
          print("DocsV2 generated exact allowlisted paths:",sorted(changed))
          PY
          python3 scripts/docs_v2_check.py
      - name: Commit and push only canonical docs with exact branch bound
        run: |
          set -euo pipefail
          git add -- docs/document-registry.json docs/DOCUMENTATION_CONTROL_PLANE.md catalog-info.yaml
          git diff --cached --quiet && exit 2
          git commit -m "docs(control): reseal Session A independent website authority intake"
          git push origin HEAD:refs/heads/session-a/website-authority-v2-20261024
