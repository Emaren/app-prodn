name: One-shot DocsV2 seal and self-removal on fast-uri security branch

on:
  push:
    branches:
      - fix/20261023-fast-uri-security-319

permissions:
  contents: write

concurrency:
  group: docs-v2-fast-uri-security-319
  cancel-in-progress: false

jobs:
  regenerate-seal-retire:
    if: github.repository == 'Emaren/app-prodn' && github.ref == 'refs/heads/fix/20261023-fast-uri-security-319'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact branch with complete ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retire the temporary workflow BEFORE generating the final baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/fast-uri-docsv2-branch-seal.yml
          git commit -m "ci: retire temporary branch-only DocsV2 sealing job"
      - name: Generate official DocsV2 baseline for workflow-free implementation head
        run: |
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 - <<'PY'
          import subprocess
          allowed={"docs/document-registry.json","docs/DOCUMENTATION_CONTROL_PLANE.md","catalog-info.yaml"}
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          untracked=set(subprocess.check_output(["git","ls-files","--others","--exclude-standard"],text=True).splitlines())
          unexpected=(changed|untracked)-allowed
          if unexpected:
              raise SystemExit("Unexpected generated paths: "+str(sorted(unexpected)))
          if not changed:
              raise SystemExit("Expected generated DocsV2 baseline update was empty")
          print("Verified docs-only regeneration:",sorted(changed))
          PY
          python3 scripts/docs_v2_check.py
      - name: Commit ONLY generated DocsV2 seal and push without force
        run: |
          git add -- catalog-info.yaml docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json
          git commit -m "docs(control): seal patched fast-uri with no persistent automation"
          git push origin HEAD:refs/heads/fix/20261023-fast-uri-security-319
