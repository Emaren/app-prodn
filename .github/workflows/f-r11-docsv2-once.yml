name: One-shot F R11 canonical DocsV2 reseal
on:
  push:
    branches:
      - repair/g-docsv2-f-r11-b13a4a91-20261030
permissions:
  contents: write
jobs:
  canonical-docsv2:
    name: Canonical DocsV2 only (F D exact-head)
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Self-retire generator, refresh exact source baseline and verify
        shell: bash {0}
        run: |
          BASE=b13a4a91d37a93ac2300dab7927544f374469101
          BRANCH=repair/g-docsv2-f-r11-b13a4a91-20261030
          TEMP=.github/workflows/f-r11-docsv2-once.yml
          if [ "$(git rev-parse HEAD^)" != "$BASE" ]; then
            echo "HOLD: WRONG_EXACT_BASE_SOURCE"
            exit 2
          fi
          if [ "$(git diff --name-only "$BASE" HEAD)" != "$TEMP" ]; then
            echo "HOLD: GENERATOR_CHANGED_UNREVIEWED_SOURCE"
            exit 2
          fi
          git switch -C "$BRANCH" || exit 2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- "$TEMP" || exit 2
          git commit -m "chore(R11): retire exact source DocsV2 generator" || exit 2
          BASELINE="$(git rev-parse HEAD)"
          python3 scripts/docs_v2_check.py --write --refresh-baseline --branch "$BRANCH" --head "$BASELINE" || exit 2
          git add -- docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json || exit 2
          EXPECTED=$(printf '%s\n' docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json)
          if [ "$(git diff --cached --name-only)" != "$EXPECTED" ]; then
            echo "HOLD: UNEXPECTED_GENERATED_FILE_DELTA"
            git diff --cached --name-only
            exit 2
          fi
          git commit -m "docs(R11): canonical exact combined-F-D lease baseline" || exit 2
          python3 scripts/docs_v2_check.py || exit 2
          if [ -n "$(git status --porcelain)" ]; then
            echo "HOLD: DIRTY_AFTER_RESEAL"
            exit 2
          fi
          git push origin "HEAD:refs/heads/$BRANCH" || exit 2
          echo "PASS: DOCSV2_EXACT_SOURCE_ONLY"
          git show -s --format='%H %P %s' HEAD
