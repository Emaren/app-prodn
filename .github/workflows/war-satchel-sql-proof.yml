name: War Satchel PostgreSQL Migration Proof

on:
  pull_request:
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/20261014_103500_war_satchel_noncrediting_foundation/**"
      - "prisma/migrations/20261014_133000_war_satchel_wallet_owner_challenges/**"
      - "tests/sql/war_satchel_wallet_challenge_contract.sql"
      - "prisma/migrations/20261014_150000_war_satchel_simulated_double_entry/**"
      - "prisma/migrations/20261014_164500_war_satchel_simulation_concurrency_guard/**"
      - "prisma/migrations/20261014_191500_war_satchel_simulation_single_owner/**"
      - "tests/sql/war_satchel_simulation_owner_isolation_contract.sql"
      - "prisma/migrations/20261015_151500_war_satchel_simulation_guard_correction/**"
      - "tests/sql/war_satchel_simulation_guard_correction_contract.sql"
      - "tests/sql/war_satchel_simulation_concurrency_test.sh"
      - "tests/sql/war_satchel_simulation_double_entry_contract.sql"
      - "tests/sql/war_satchel_foundation_contract.sql"
      - "tests/sql/war_satchel_atomic_migration_rehearsal.sh"
      - ".github/workflows/war-satchel-sql-proof.yml"
  push:
    branches: [main]
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/20261014_103500_war_satchel_noncrediting_foundation/**"
      - "prisma/migrations/20261014_133000_war_satchel_wallet_owner_challenges/**"
      - "tests/sql/war_satchel_wallet_challenge_contract.sql"
      - "prisma/migrations/20261014_150000_war_satchel_simulated_double_entry/**"
      - "prisma/migrations/20261014_164500_war_satchel_simulation_concurrency_guard/**"
      - "prisma/migrations/20261014_191500_war_satchel_simulation_single_owner/**"
      - "tests/sql/war_satchel_simulation_owner_isolation_contract.sql"
      - "prisma/migrations/20261015_151500_war_satchel_simulation_guard_correction/**"
      - "tests/sql/war_satchel_simulation_guard_correction_contract.sql"
      - "tests/sql/war_satchel_simulation_concurrency_test.sh"
      - "tests/sql/war_satchel_simulation_double_entry_contract.sql"
      - "tests/sql/war_satchel_foundation_contract.sql"
      - "tests/sql/war_satchel_atomic_migration_rehearsal.sh"
      - ".github/workflows/war-satchel-sql-proof.yml"

permissions:
  contents: read

jobs:
  non-crediting-contract:
    name: PostgreSQL 16 / War Satchel exact proof constraints
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: satchel_ci
          POSTGRES_PASSWORD: satchel_ci_ephemeral
          POSTGRES_DB: satchel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U satchel_ci -d satchel_ci"
          --health-interval 4s
          --health-timeout 4s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: satchel_ci
      PGPASSWORD: satchel_ci_ephemeral
      PGDATABASE: satchel_ci
    steps:
      - uses: actions/checkout@v7
      - name: Prepare isolated synthetic user key dependency
        run: psql -X -v ON_ERROR_STOP=1 -c 'CREATE TABLE users (id INTEGER PRIMARY KEY)'
      - name: Execute real PostgreSQL migration (fail closed)
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -f prisma/migrations/20261014_103500_war_satchel_noncrediting_foundation/migration.sql
      - name: Prove real SQL rejects double credits, cross-owner funds and mutation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/war_satchel_foundation_contract.sql
      - name: Execute server-issued one-use Keplr challenge migration
        run: psql -X -v ON_ERROR_STOP=1 -f prisma/migrations/20261014_133000_war_satchel_wallet_owner_challenges/migration.sql
      - name: Test challenge replay, expiry, quota, owner and nonce immutability
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/war_satchel_wallet_challenge_contract.sql
      - name: Migrate isolated simulation-only double-entry journal
        run: psql -X -v ON_ERROR_STOP=1 -f prisma/migrations/20261014_150000_war_satchel_simulated_double_entry/migration.sql
      - name: Prove zero-sum, non-overdraft and immutable sandbox journals
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/war_satchel_simulation_double_entry_contract.sql
      - name: Install additive transaction-serialization guard
        run: psql -X -v ON_ERROR_STOP=1 -f prisma/migrations/20261014_164500_war_satchel_simulation_concurrency_guard/migration.sql
      - name: Race two user reservations against one available WOLO balance
        run: bash tests/sql/war_satchel_simulation_concurrency_test.sh
      - name: Install additive cross-user liability isolation guard
        run: psql -X -v ON_ERROR_STOP=1 -f prisma/migrations/20261014_191500_war_satchel_simulation_single_owner/migration.sql
      - name: Prove balanced journals cannot silently transfer another player's liability
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/war_satchel_simulation_owner_isolation_contract.sql
      - name: Correct simulation owner cardinality versus overdraft guard
        run: psql -X -v ON_ERROR_STOP=1 -f prisma/migrations/20261015_151500_war_satchel_simulation_guard_correction/migration.sql
      - name: Prove valid single-owner release and rejection of mixed-owner or fake real credit
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/war_satchel_simulation_guard_correction_contract.sql

  atomic-six-migration-rehearsal:
    name: PostgreSQL 16 / six-migration atomic rollback (NO DEPLOY)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: satchel_ci
          POSTGRES_PASSWORD: satchel_ci_ephemeral
          POSTGRES_DB: satchel_atomic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U satchel_ci -d satchel_atomic_ci"
          --health-interval 4s
          --health-timeout 4s
          --health-retries 12
    env:
      CI: "true"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: satchel_ci
      PGPASSWORD: satchel_ci_ephemeral
      PGDATABASE: satchel_atomic_ci
    steps:
      - uses: actions/checkout@v7
      - name: Assert full six-migration sequence rolls back cleanly on synthetic PostgreSQL
        run: bash tests/sql/war_satchel_atomic_migration_rehearsal.sh
