name: Kingdom Index criterion submission boundary
on:
  pull_request:
    paths:
      - 'lib/kingdomIndexCriterionSubmission.mjs'
      - 'lib/kingdomIndexTrustedPublication.mjs'
      - 'lib/kingdomIndexCriterionNonceStore.mjs'
      - 'lib/kingdomIndexCriterionArtifactVerifier.mjs'
      - 'lib/kingdomIndexCriterionProofPolicy.mjs'
      - 'lib/kingdomIndexPerformanceReceipt.mjs'
      - 'lib/kingdomIndexBrowserReceipt.mjs'
      - 'scripts/kingdom_index_browser_receipt_audit.mjs'
      - 'scripts/kingdom_index_certification_preflight.py'
      - 'tests/kingdom-index-criterion-submission.test.mts'
      - 'tests/kingdom-index-trusted-publication.test.mts'
      - 'scripts/kingdom_index_emitted_closure.mjs'
      - 'tests/kingdom-index-emitted-closure.test.mts'
      - 'scripts/kingdom_index_loopback_api_probe.mjs'
      - 'tests/kingdom-index-loopback-api-probe.test.mts'
      - 'tests/kingdom-index-criterion-nonce-store.test.mts'
      - 'tests/kingdom-index-criterion-artifact-verifier.test.mts'
      - 'tests/kingdom-index-performance-receipt.test.mts'
      - 'tests/kingdom-index-browser-receipt.test.mts'
      - 'tests/kingdom-index-browser-receipt-cli.test.mts'
      - 'tests/test_kingdom_index_certification_preflight.py'
      - 'config/kingdom-index-quality-rubric.json'
      - 'config/kingdom-index-assurance-profiles.json'
      - '.github/workflows/kingdom-index-criterion-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adversarial-evidence-boundary:
    name: Untrusted receipt, signature, rubric and replay refusal (fixtures only)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise signed criterion evidence boundary
        run: |
          set -euo pipefail
          node --experimental-strip-types --test tests/kingdom-index-criterion-submission.test.mts tests/kingdom-index-criterion-nonce-store.test.mts tests/kingdom-index-criterion-artifact-verifier.test.mts tests/kingdom-index-performance-receipt.test.mts tests/kingdom-index-browser-receipt.test.mts tests/kingdom-index-browser-receipt-cli.test.mts tests/kingdom-index-trusted-publication.test.mts tests/kingdom-index-emitted-closure.test.mts tests/kingdom-index-loopback-api-probe.test.mts
      - name: Exercise first-page 100-point qualification plan (not a certificate)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_kingdom_index_certification_preflight.py'
          python3 scripts/kingdom_index_certification_preflight.py --route /kingdom-index
      - name: Confirm no public live score authority was activated
        run: |
          set -euo pipefail
          ! grep -q 'kingdomIndexCriterionSubmission' lib/kingdomIndex.ts
          grep -q 'return null;' lib/kingdomIndexAuditStatus.ts

  independent-type-probe:
    name: Index exact-head TS contract (NOT production approval)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact locked packages without lifecycle execution
        run: |
          set -euo pipefail
          corepack enable
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Generate Prisma client for typing, never connect to live DB
        run: |
          set -euo pipefail
          yarn prisma:generate
      - name: Type-check source only; does not waive dependency security or release holds
        run: |
          set -euo pipefail
          yarn tsc --noEmit --pretty false

  emitted-artifact-observation:
    name: Exact PR-head Next emitted closure (observation ONLY)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aoe2war_ci
      SESSION_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_URL: http://127.0.0.1:3030
      EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate source, not synthetic PR merge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: yarn
      - name: Resolve immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "Inspected Git SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "This read-only job is NOT release approval or production closure." >> "$GITHUB_STEP_SUMMARY"
      - name: Install exact pinned build dependencies
        run: |
          set -euo pipefail
          corepack enable
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npx prisma generate
      - name: Build isolated candidate, not production
        run: |
          set -euo pipefail
          yarn build
      - name: Capture emitted source/build evidence without certification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kingdom-index-build-evidence
          node scripts/kingdom_index_emitted_closure.mjs \
            --expected-sha "$EXPECTED_CANDIDATE_SHA" \
            > kingdom-index-build-evidence/emitted-closure.json
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const report=JSON.parse(readFileSync('kingdom-index-build-evidence/emitted-closure.json','utf8'));
          if(report.certified!==false||report.publicationAuthorized!==false||
             report.sourceSha!==process.env.EXPECTED_CANDIDATE_SHA)
            throw Error('Misleading or unbound collector receipt');
          console.log('Build observation:',report.status,report.buildId,
            'files',report.files.length,'missing',report.missing.length);
          NODE
      - name: Upload inspectable build evidence (not a release receipt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingdom-index-emitted-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: kingdom-index-build-evidence/emitted-closure.json
          if-no-files-found: ignore
          retention-days: 14
