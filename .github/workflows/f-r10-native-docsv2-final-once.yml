name: One-shot R10 F native final source DocsV2 seal
on:
  push:
    branches:
      - repair/g-docsv2-f-r10-native-1ea63d4a-20261030
permissions:
  contents: write
jobs:
  canonical-docsv2:
    name: Canonical exact R10 F source DocsV2 generator
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Self-retire and refresh exact source baseline
        shell: bash {0}
        run: |
          EXPECTED=62c44813345bc43dead24bdf7375bb26a08fa7ba
          BRANCH=repair/g-docsv2-f-r10-native-1ea63d4a-20261030
          TEMP=.github/workflows/f-r10-native-docsv2-final-once.yml
          if [ "$(git rev-parse HEAD^)" != "$EXPECTED" ]; then
            echo "HOLD: SOURCE_CHANGED_AFTER_RESEAL_REQUEST"
            exit 2
          fi
          if [ "$(git diff --name-only "$EXPECTED" HEAD)" != "$TEMP" ]; then
            echo "HOLD: SOURCE_DELTA_NOT_ONLY_EPHEMERAL_WORKFLOW"
            exit 2
          fi
          git switch -C "$BRANCH" || exit 2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$TEMP" || exit 2
          git commit -m "chore(R10): retire final native issuer docs generator" || exit 2
          BASELINE=$(git rev-parse HEAD)
          python3 scripts/docs_v2_check.py --write --refresh-baseline --branch "$BRANCH" --head "$BASELINE" || exit 2
          git add -- docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json || exit 2
          CHANGED=$(git diff --cached --name-only)
          EXPECTED_DOCS=$(printf '%s\n' docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json)
          if [ "$CHANGED" != "$EXPECTED_DOCS" ]; then
            echo "HOLD: NONCANONICAL_DOCS_DIFF $CHANGED"
            exit 2
          fi
          git commit -m "docs(R10): reseal final native issuer and FD200 lease baseline" || exit 2
          python3 scripts/docs_v2_check.py || exit 2
          if [ -n "$(git status --porcelain)" ]; then
            echo "HOLD: WORKFLOW_NOT_CLEAN"
            exit 2
          fi
          git push origin "HEAD:refs/heads/$BRANCH" || exit 2
          echo "PASS: FINAL_R10_DOCSV2_REFRESHED_SOURCE_UNCHANGED"
