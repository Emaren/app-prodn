name: One-time held Satchel DocsV2 seal and self-retire (NO RELEASE)

on:
  push:
    branches:
      - integration/20261023-satchel-final-gated

permissions:
  contents: write

concurrency:
  group: docs-v2-held-satchel-20261023
  cancel-in-progress: false

jobs:
  seal:
    if: github.repository == 'Emaren/app-prodn' && github.ref == 'refs/heads/integration/20261023-satchel-final-gated'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retire this privileged temporary tool in a dedicated commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/satchel-release-docsv2-seal-temp.yml
          git commit -m "ci(held): retire one-time docs sealing tool"
      - name: Generate DocsV2 after final implementation commit
        run: |
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 - <<'PY'
          import subprocess
          permitted={'catalog-info.yaml','docs/DOCUMENTATION_CONTROL_PLANE.md','docs/document-registry.json'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          if (changed|untracked)-permitted:
              raise SystemExit('Unexpected DocsV2 source change: '+str(sorted((changed|untracked)-permitted)))
          if not changed:
              raise SystemExit('DocsV2 baseline was not regenerated')
          print('DocsV2 generated paths verified',sorted(changed))
          PY
          python3 scripts/docs_v2_check.py
      - name: Push only regenerated documentation to held source
        run: |
          git add -- catalog-info.yaml docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json
          git commit -m "docs(held): seal Satchel LIVE + 10k-50k + reviewed verifier source"
          git push origin HEAD:refs/heads/integration/20261023-satchel-final-gated
