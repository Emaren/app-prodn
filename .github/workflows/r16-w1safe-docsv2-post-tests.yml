name: R16 canonical W1_SAFE corrected-trophy-tests baseline
on:
  push:
    branches: [r16-w1safe-docsv2-post-tests]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Recompute source-bound canonical documentation
        run: |
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 scripts/docs_v2_check.py
      - name: Retire temporary workflow and publish canonical two-doc baseline
        run: |
          git config user.name 'aoe2war-docsv2-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r16-w1safe-docsv2-post-tests.yml
          git add docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json
          git diff --cached --stat
          git diff --cached --quiet && exit 1
          git commit -m 'docs(R16): full W1_SAFE security and public-finance regression baseline'
          git push origin HEAD:refs/heads/r16-w1safe-docsv2-post-tests
