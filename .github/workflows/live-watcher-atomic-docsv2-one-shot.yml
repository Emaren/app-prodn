name: One-shot atomic LIVE admission DocsV2 seal (NO DEPLOY)

on:
  push:
    branches:
      - review/20261024-live-watcher-atomic-admission

permissions:
  contents: write

concurrency:
  group: one-shot-held-live-market-atomic-20261024
  cancel-in-progress: false

jobs:
  self-retire-and-seal:
    if: github.repository == 'Emaren/app-prodn' && github.ref == 'refs/heads/review/20261024-live-watcher-atomic-admission'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retire temporary sealing workflow before release scope is calculated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/live-watcher-atomic-docsv2-one-shot.yml
          git commit -m "ci(held): retire one-shot LIVE atomic DocsV2 seal helper"
      - name: Generate canonical source-bound documentation
        run: |
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 - <<'PY'
          import subprocess
          allowed={'catalog-info.yaml','docs/DOCUMENTATION_CONTROL_PLANE.md','docs/document-registry.json'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          if (changed|untracked)-allowed:
              raise SystemExit('STOP unexpected DocsV2 output '+str(sorted((changed|untracked)-allowed)))
          print('DocsV2 changed',sorted(changed))
          PY
          python3 scripts/docs_v2_check.py
          git add -- catalog-info.yaml docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json
          git diff --cached --quiet || git commit -m "docs(held): certify atomic LIVE market admission source"
          git push origin HEAD:refs/heads/review/20261024-live-watcher-atomic-admission
