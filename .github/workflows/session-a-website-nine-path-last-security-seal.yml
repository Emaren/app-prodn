name: One-shot nine-path website protected-release security DocsV2 seal
on:
  push:
    branches:
      - session-a/20261024-website-nine-path-operational-finish
permissions:
  contents: write
concurrency:
  group: session-a-nine-path-final-security-seal
  cancel-in-progress: false
jobs:
  retire-then-seal:
    if: github.repository == 'Emaren/app-prodn' && github.ref == 'refs/heads/session-a/20261024-website-nine-path-operational-finish'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Remove own temporary workflow before computing source baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/session-a/20261024-website-nine-path-operational-finish"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/session-a-website-nine-path-last-security-seal.yml
          git commit -m "ci: retire nine-path corrected Watcher test sealer"
      - name: Seal only canonical DocsV2 paths
        run: |
          set -euo pipefail
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 - <<'PY'
          import subprocess
          allowed={"docs/document-registry.json","docs/DOCUMENTATION_CONTROL_PLANE.md","catalog-info.yaml"}
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          untracked=set(subprocess.check_output(["git","ls-files","--others","--exclude-standard"],text=True).splitlines())
          if not changed or (changed|untracked)-allowed:
              raise SystemExit("Unsafe DocsV2 generated paths: "+str(sorted(changed|untracked)))
          print("Allowed DocsV2 source seal:",sorted(changed))
          PY
          python3 scripts/docs_v2_check.py
      - name: Push canonical documentation seal only to this isolated branch
        run: |
          set -euo pipefail
          git add -- docs/document-registry.json docs/DOCUMENTATION_CONTROL_PLANE.md catalog-info.yaml
          git diff --cached --quiet && exit 2
          git commit -m "docs(control): source seal corrected nine-path Watcher and operator diagnostics"
          git push origin HEAD:refs/heads/session-a/20261024-website-nine-path-operational-finish
