name: Q17 Phase-1 exact Chrome-source DocsV2 repair
on:
  push:
    branches:
      - feature/storage-transfer-control-room-20261030
    paths:
      - .github/workflows/g-q17-phase1-docsv2-once.yml

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: "22.22.0" }
      - name: Check real G test source, remove one-shot before recording baseline
        run: |
          git switch -C feature/storage-transfer-control-room-20261030
          git merge-base --is-ancestor 945be7267088890198cab67f16e75442ebf8cd47 HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/g-q17-phase1-docsv2-once.yml
          git commit -m "chore(Q17): retire exact source DocsV2 one-shot"
          node --check tests/navigation-atlas-browser.cjs
          node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test tests/navigation-atlas-source.test.mts
      - name: Canonical source-bound DocsV2 for post-W1 Phase-1 branch
        run: |
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path("docs/document-registry.json").read_text())
          assert len(reg["documents"])==102, "post-W1 doc count drift"
          code=Path("tests/navigation-atlas-browser.cjs").read_text()
          assert "approvedRoutes.length" in code and "adminNodes:32" not in code
          assert "storage search must find both Storage OS and Storage Transfer" in code
          print("PASS: exact Phase-1 Q17 DocsV2 102 documents",reg["implementation_baseline"])
          PY
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json)"
          if [ "$actual" != "$expected" ]; then
            echo "HOLD UNEXPECTED DOCSV2 FILES"; printf '%s\n' "$actual"; exit 1
          fi
          git add docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json
          git commit -m "docs(Q17): seal Phase-1 33-private-route Chrome regression baseline"
          python3 scripts/docs_v2_check.py
          git diff --exit-code
          git push origin HEAD:feature/storage-transfer-control-room-20261030
