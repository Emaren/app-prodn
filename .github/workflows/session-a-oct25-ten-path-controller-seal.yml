name: One-shot exact ten-path website operator source seal
on:
  push:
    branches:
      - session-a/20261024-website-nine-path-operational-finish
permissions:
  contents: write
concurrency:
  group: session-a-oct25-ten-path-controller-seal
  cancel-in-progress: false
jobs:
  self-retire-and-seal:
    if: github.repository == 'Emaren/app-prodn' && github.ref == 'refs/heads/session-a/20261024-website-nine-path-operational-finish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Self-retire before generating implementation baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/session-a/20261024-website-nine-path-operational-finish"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/session-a-oct25-ten-path-controller-seal.yml
          git commit -m 'ci: retire temporary reviewed product controller source sealer'
      - name: Canonical governed DocsV2 source seal
        run: |
          set -euo pipefail
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 - <<'PY'
          import subprocess
          allowed={'docs/document-registry.json','docs/DOCUMENTATION_CONTROL_PLANE.md','catalog-info.yaml'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          if not changed or (changed|untracked)-allowed:
              raise SystemExit('UNEXPECTED_DOCSV2_CHANGE='+str(sorted(changed|untracked)))
          print('DOCS_SEAL_SCOPE=',sorted(changed))
          PY
          python3 scripts/docs_v2_check.py
      - name: Commit only generated protected-controller DocsV2 files
        run: |
          set -euo pipefail
          git add -- docs/document-registry.json docs/DOCUMENTATION_CONTROL_PLANE.md catalog-info.yaml
          git diff --cached --quiet && exit 2
          git commit -m 'docs(control): seal ten-path immutable website candidate and protected approval code'
          git push origin HEAD:refs/heads/session-a/20261024-website-nine-path-operational-finish
