name: G Storage Transfer FINAL exact Chrome-passed DocsV2 seal
on:
  push:
    branches:
      - review/g-operation-storage-transfer-visual-20261030
    paths:
      - .github/workflows/g-storage-transfer-final-seal.yml
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Require exact Chrome-passed source and retire generator
        run: |
          git switch -C review/g-operation-storage-transfer-visual-20261030
          git merge-base --is-ancestor 6083fdcee5addb70a1b7d34f121a2c548dac633e HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/g-storage-transfer-final-seal.yml
          git commit -m "chore(storage-transfer): retire final one-shot DocsV2 source sealer"
      - name: Generate exact source-bound DocsV2 and verify private inventory
        run: |
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path("docs/document-registry.json").read_text())
          assert len(doc["documents"])==102, "Accepted post-W1 has exactly 102 registered documents"
          inv=json.loads(Path("config/kingdom-index-inventory.json").read_text())
          assert inv["counts"]["pageTemplates"]==152
          assert inv["counts"]["routeHandlerTemplates"]==283
          assert inv["counts"]["publicIndexTemplates"]==88
          assert any(p["href"]=="/admin/storage-transfer" and p["scope"]=="admin-path" for p in inv["pages"])
          assert any(p["entrypoint"]=="app/api/admin/storage-transfer/route.ts" and p["scope"]=="api" for p in inv["handlers"])
          api=Path("app/api/admin/storage-transfer/route.ts").read_text()
          assert "transferReceipt: null" in api and 'admin.error.headers.set("Cache-Control"' in api
          print("DOCSV2 PASS: 102 docs, 152/283 private census, no untrusted transfer publisher")
          PY
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json)"
          if [ "$actual" != "$expected" ]; then echo "HOLD: generated DocsV2 changed unexpected paths"; printf '%s\n' "$actual"; exit 1; fi
          git add docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json
          git commit -m "docs(storage-transfer): final Chrome-accepted 102-doc source baseline and private route inventory"
          python3 scripts/docs_v2_check.py
          git diff --exit-code
          git push origin HEAD:review/g-operation-storage-transfer-visual-20261030
