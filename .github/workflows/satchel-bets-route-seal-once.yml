name: One-shot held /bets source-census refresh (NO FINANCIAL ACTION)

on:
  push:
    branches:
      - integration/20261023-satchel-final-gated

permissions:
  contents: write

concurrency:
  group: satchel-bets-route-seal-20261023
  cancel-in-progress: false

jobs:
  verify-route-and-reseal:
    if: github.repository == 'Emaren/app-prodn' && github.ref == 'refs/heads/integration/20261023-satchel-final-gated'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Self-remove temporary workflow before route-scanning committed HEAD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/satchel-bets-route-seal-once.yml
          git commit -m "ci(held): retire route-registry resealing helper"
      - name: Refresh only the observed route source tree fingerprint
        run: |
          node scripts/kingdom_index_source_audit.mjs --write
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed!={'config/kingdom-index-routes.json'}:
              raise SystemExit('STOP: unexpected source audit paths '+repr(sorted(changed)))
          fresh=json.loads(Path('config/kingdom-index-routes.json').read_text())
          original=json.loads(subprocess.check_output(['git','show','HEAD:config/kingdom-index-routes.json'],text=True))
          altered=[(o['href'],o['sourceTree'],n['sourceTree']) for o,n in zip(original,fresh) if o!=n]
          if len(altered)!=1 or altered[0][0]!='/bets':
              raise SystemExit('STOP: route audit modified unexpected routes '+repr(altered))
          print('Verified changed route',altered)
          PY
          git add -- config/kingdom-index-routes.json
          git commit -m "audit(held): refresh actual /bets route source fingerprint"
          node scripts/kingdom_index_source_audit.mjs --check
      - name: Refresh source-bound DocsV2 index after census implementation commit
        run: |
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 - <<'PY'
          import subprocess
          allowed={'docs/DOCUMENTATION_CONTROL_PLANE.md','docs/document-registry.json','catalog-info.yaml'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed-allowed:
              raise SystemExit('STOP: unexpected DocsV2 paths '+repr(sorted(changed-allowed)))
          PY
          python3 scripts/docs_v2_check.py
          git add -- catalog-info.yaml docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json
          git diff --cached --quiet || git commit -m "docs(held): source-seal actual /bets provenance"
          git push origin HEAD:refs/heads/integration/20261023-satchel-final-gated
