name: One-shot Final Human Signer Operator DocsV2 Seal
on:
  push:
    branches: [session-a/20261024-website-nine-path-operational-finish]
permissions:
  contents: write
concurrency:
  group: session-a-20261025-last-human-witness-seal
  cancel-in-progress: false
jobs:
  retire-and-seal:
    if: github.repository == 'Emaren/app-prodn' && github.ref == 'refs/heads/session-a/20261024-website-nine-path-operational-finish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retire this one-use workflow before calculating governed source tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$GITHUB_REF" = "refs/heads/session-a/20261024-website-nine-path-operational-finish"
          git rm .github/workflows/session-a-20261025-final-human-signers-source-seal.yml
          git commit -m 'ci: retire last one-shot Mac phase receipt source sealer'
      - name: Regenerate only governed DocsV2 source-bound files
        run: |
          set -euo pipefail
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 - <<'PY'
          import subprocess
          allowed={'docs/document-registry.json','docs/DOCUMENTATION_CONTROL_PLANE.md','catalog-info.yaml'}
          changes=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          if not changes or (changes|untracked)-allowed:
              raise SystemExit('UNEXPECTED_SOURCE_REGISTRY='+str(sorted(changes|untracked)))
          print('DOCS_ONLY_SOURCE_SEAL=',sorted(changes))
          PY
          python3 scripts/docs_v2_check.py
      - name: Save bounded canonical DocsV2 control receipts
        run: |
          set -euo pipefail
          git add -- docs/document-registry.json docs/DOCUMENTATION_CONTROL_PLANE.md catalog-info.yaml
          git diff --cached --quiet && exit 2
          git commit -m 'docs(control): seal independently reviewed Mac source pin and private proof outputs'
          git push origin HEAD:refs/heads/session-a/20261024-website-nine-path-operational-finish
