name: One-shot Kingdom instruments docs seal

on:
  push:
    branches:
      - feature/kingdom-transparent-machinery-20261019
    paths:
      - ".kingdom-instruments-doc-trigger"

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout authorized isolated implementation with full ancestry
        uses: actions/checkout@v4
        with:
          ref: feature/kingdom-transparent-machinery-20261019
          fetch-depth: 0
          persist-credentials: true
      - name: Retire one-shot job and regenerate exact-source documented state
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/kingdom-transparent-machinery-20261019"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-kingdom-instruments-docs.yml .kingdom-instruments-doc-trigger
          git commit -m "chore(kingdom): retire one-shot instrumentation docs helper"
          python3 scripts/docs_v2_check.py --write --refresh-baseline \
            --branch feature/kingdom-transparent-machinery-20261019 \
            --head "$(git rev-parse HEAD)"
          python3 scripts/docs_v2_check.py
          git add docs/document-registry.json docs/DOCUMENTATION_CONTROL_PLANE.md catalog-info.yaml
          if ! git diff --cached --quiet; then
            git commit -m "docs(kingdom): bind machine instruments to exact cleaned implementation"
          fi
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/kingdom-transparent-machinery-20261019
