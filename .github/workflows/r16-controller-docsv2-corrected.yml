name: R16 corrected controller canonical DocsV2
on:
  push:
    branches: [r16-controller-docsv2-corrected]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Generate exact canonical DocsV2 without waiver
        run: |
          python3 scripts/docs_v2_check.py --write --refresh-baseline
          python3 scripts/docs_v2_check.py
      - name: Self-retire temporary generator and seal docs only
        run: |
          git config user.name 'aoe2war-docsv2-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r16-controller-docsv2-corrected.yml
          git add docs/DOCUMENTATION_CONTROL_PLANE.md docs/document-registry.json
          git diff --cached --stat
          git diff --cached --quiet && exit 1
          git commit -m 'docs(R16): canonical protected installer and six-producer source baseline'
          git push origin HEAD:refs/heads/r16-controller-docsv2-corrected
